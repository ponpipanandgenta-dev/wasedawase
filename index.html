<body>
<div class="app">
<header><div><h1>浪人シミュレーター <span class="sub">WASEDA RUN</span></h1><div class="sub">2026年度 — 早稲田合格を目指せ ・ 登場人物は全員18歳以上</div></div>
<div class="top"><button class="btn" onclick="saveGame()">保存</button><button class="btn" onclick="loadGame()">読込</button><button class="btn" onclick="resetGame()">最初から</button></div></header>

<section class="hero"><div class="hero-main"><div class="hero-avatar" id="heroAvatar"></div><div class="hero-copy"><div class="eyebrow">WASEDA RUN / RONIN LIFE</div><h2 id="date">4月1日（水）</h2><p id="phase">浪人生活、開始。</p><div class="progress" id="days"></div><div class="hero-quote" id="heroQuote">今年こそ、絶対に早稲田へ。</div></div></div><div class="hero-kpis"><div><span>英語</span><b id="heroEng">48</b></div><div><span>世界史</span><b id="heroWorld">50</b></div><div><span>メンタル</span><b id="heroMental">75</b></div><div><span>所持金</span><b id="heroMoney">¥80,000</b></div></div></section>

<div class="grid">
<main>
<div class="card">
<div class="tabs"><button class="tab on" onclick="showTab('status',this)">ステータス</button><button class="tab" onclick="showTab('people',this)">人間関係</button><button class="tab" onclick="showTab('calendar',this)">年間予定</button><button class="tab" onclick="showTab('world',this)">世界</button><button class="tab" onclick="showTab('history',this)">1年の記録</button><button class="tab" onclick="openRelationshipGraph()">💞 相関図</button></div>
<div id="status">
<div class="stats" id="stats"></div>
<h3 style="margin-top:16px">今日の行動</h3><div class="actions" id="actions"></div>
</div>
<div id="people" style="display:none"><div class="muted" style="margin-bottom:7px">行動すると好感・信頼・親密度が変化。関係が進むと固有イベントが解禁。</div><div class="people" id="peopleList"></div></div>
<div id="calendar" style="display:none"><div class="timeline" id="monthEvents"></div><div style="height:7px"></div><div class="calendar" id="calendarGrid"></div></div>
<div id="world" style="display:none"><h3>今日どこへ行く？</h3><div class="mapgrid" id="map"></div><div class="eventcard"><b>噂・人間関係</b><div id="rumors"></div></div><div class="eventcard"><b>約束</b><div id="promises"></div></div><div class="eventcard"><b>世界の裏側</b><div id="deepWorld"></div></div></div>
<div id="history" style="display:none"><div class="summary" id="summary"></div><div class="eventcard"><b>この1年の出来事</b><div id="milestones"></div></div><div class="eventcard"><b>今回のルート・伏線</b><div id="routeInfo"></div></div></div>
</div>
<div class="card" style="margin-top:14px"><h3>生活ログ</h3><div class="log" id="log"></div></div>
</main>

<aside>
<div class="card"><h3>受験状況</h3><div id="exam"></div></div>
<div class="card" style="margin-top:14px"><h3>現在の所持金</h3><div style="font-size:26px;font-weight:700" id="money"></div><div class="muted">バイト・出費・イベントで変動</div></div>
<div class="card" style="margin-top:14px"><h3>今日の目標</h3><div id="goal"></div></div>
<div class="card" style="margin-top:14px"><h3>予備校ランキング</h3><div id="ranking"></div></div>
</aside>
</div>
</div>

<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="choices" id="choices"></div></div></div>

<script>
const initial={
day:0, money:80000, energy:80, mental:75, health:80,
eng:48,jpn:42,world:50,writing:40,
study:0, streak:0, totalStudy:0, saved:false, unreadLines:0, lineInbox:[], npcScores:{},
people:{
 rinka:{name:"りんか",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 mokujyo:{name:"もくじょ",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 tetsu:{name:"てつ",type:"ライバル",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},

 ryuto:{name:"りゅうと",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 yuta:{name:"ゆうた",type:"明るい友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 yugo:{name:"ゆうご",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 daisuke:{name:"だいすけ",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 rasuro:{name:"ラスロ",type:"イケメン",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 takeshi:{name:"たけし",type:"アホな友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 rise:{name:"りせ",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 yuuri:{name:"ゆうり",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 mihana:{name:"みはな",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 mimoe:{name:"みもえ",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 kurumi:{name:"くるみ",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99}
},
logs:[{t:"4月1日",x:"今日から浪人生活が始まった。第一志望は早稲田。",c:"special"}]
};
let g=JSON.parse(JSON.stringify(initial));
const dow=["水","木","金","土","日","月","火"];
const months=[30,31,30,31,31,30,31,30,31,30,31,31];

function $(id){return document.getElementById(id)}
function dateObj(){let d=new Date(2026,3,1);d.setDate(d.getDate()+g.day);return d}
function dateStr(){let d=dateObj();return `${d.getMonth()+1}月${d.getDate()}日（${dow[g.day%7]}）`}
function clamp(n,a=0,b=100){return Math.max(a,Math.min(b,n))}
const romanceCandidates=new Set(["rinka","rise","yuuri","mihana","mimoe","kurumi"]);
function isRomance(k){return romanceCandidates.has(k)}
function addLog(x,c=""){g.logs.unshift({t:dateStr(),x,c}); if(g.logs.length>80)g.logs.pop()}
function stat(label,val,desc){return `<div class="stat"><span>${label}</span><b>${Math.round(val)}</b><div class="bar"><div class="fill" style="width:${clamp(val)}%"></div></div><span>${desc}</span></div>`}

function avatarSvg(k,kind='npc',state='未交流',mood=50){
 const female=new Set(['rinka','rise','yuuri','mihana','mimoe','kurumi']);
 const palette={rinka:['#7a493d','#e8a07c','#f5d8c8'],rise:['#25334d','#d98b76','#f2d3c4'],yuuri:['#513b69','#d99b9f','#f0d2c4'],mihana:['#244d63','#df9c83','#f2d8c9'],mimoe:['#5b3c53','#d78b78','#f2d0c3'],kurumi:['#7b5b37','#e0a07e','#f4d9c9'],mokujyo:['#2d3440','#c58f76','#e4c7b7'],tetsu:['#3a4657','#b87968','#e3c1b3'],ryuto:['#4d3b35','#c7836f','#e4c6b7'],yuta:['#7b5b32','#d28f73','#edcbbb'],yugo:['#233f58','#c17e6c','#e2c1b2'],daisuke:['#5b3b2c','#c9866d','#e4c5b6'],rasuro:['#202a42','#b87872','#e2c0b6'],takeshi:['#67462d','#c88970','#e5c6b7'],player:['#172538','#b97869','#e6c5b6']};
 const [hair,skin,shirt]=palette[k]||palette.player; const f=female.has(k); const happy=mood>=70; const sad=mood<30;
 const eyes=happy?'• •':sad?'╲ ╱':'• •';
 return `<svg class="avatar-svg" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg${k}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162335"/><stop offset="1" stop-color="#0a1018"/></linearGradient></defs><rect width="100" height="120" rx="12" fill="url(#bg${k})"/><ellipse cx="50" cy="112" rx="35" ry="24" fill="${shirt}"/><path d="M29 112 Q30 83 50 79 Q70 83 71 112" fill="${shirt}"/><ellipse cx="50" cy="57" rx="25" ry="31" fill="${skin}"/><path d="M25 55 Q21 22 51 18 Q81 21 75 57 Q67 39 50 42 Q35 38 25 55" fill="${hair}"/><path d="M27 49 Q35 29 51 30 Q67 29 75 48 Q66 40 57 39 Q42 39 27 49" fill="${hair}"/>${f?'<path d="M27 58 Q22 69 30 78" stroke="'+hair+'" stroke-width="7" fill="none"/><path d="M73 58 Q78 69 70 78" stroke="'+hair+'" stroke-width="7" fill="none"/>':''}<text x="50" y="64" text-anchor="middle" font-size="8" fill="#5a3b39" opacity=".9">${eyes}</text><path d="M44 73 Q50 ${sad?70:happy?77:75} 56 73" stroke="#7a4d4a" stroke-width="1.7" fill="none" stroke-linecap="round"/><circle cx="42" cy="64" r="2" fill="#fff" opacity=".35"/><circle cx="58" cy="64" r="2" fill="#fff" opacity=".35"/></svg>`;
}
function relationBadge(p){const s=p.state||relationStage(p);const map={'恋人':'💗 恋人','セフレ':'💜 セフレ','ライバル':'⚔️ ライバル','喧嘩中':'💢 喧嘩中','元恋人':'💔 元恋人','親しい':'💙 親しい','友達':'🤝 友達','好意あり':'💞 好意あり','未交流':'○ 未交流'};return map[s]||`◦ ${s}`}

function render(){
$("heroAvatar").innerHTML=avatarSvg("player","player","",g.mood||50);
$("heroEng").textContent=Math.round(g.eng);$("heroWorld").textContent=Math.round(g.world);$("heroMental").textContent=Math.round(g.mental);$("heroMoney").textContent=`¥${g.money.toLocaleString()}`;
$("date").textContent=dateStr();

function skipDays(n){
  ensureV3();
  if(g.day>=364){finish();return;}
  const start=g.day;
  let stopped=false, reason='';
  for(let i=0;i<n && g.day<364;i++){
    // Simulate one ordinary day without rendering after every step.
    autonomousWorld();
    g.energy=clamp(g.energy+15);
    g.health=clamp(g.health-1);
    g.mental=clamp(g.mental-1);
    if(Math.random()<0.24) randomEvent();
    g.day++;
    if(g.day%7===0){g.money-=3500;addLog('週の生活費として¥3,500使った。');}
    if(g.day%30===0){g.eng+=1;g.jpn+=1;g.world+=1;addLog('1か月の継続効果で基礎力が少し伸びた。','good');monthlyEvent();}
    // Promises and important relationship events interrupt the skip.
    const due=g.promises.find(pr=>!pr.done&&pr.day===g.day);
    if(due){stopped=true;reason='約束の日';break;}
    // Stop at major exam days.
    if([305,315,325,335].includes(g.day)){stopped=true;reason='大型イベント';break;}
  }
  const moved=g.day-start;
  addLog(`${moved}日間を高速シミュレーションした。${stopped?'重要イベントで停止。':''}`,'special');
  render();
  if(g.day>=364){finish();return;}
  const due=g.promises.find(pr=>!pr.done&&pr.day===g.day);
  if(due){checkPromises();return;}
  if(stopped){
    if([305,315,325,335].includes(g.day)){
      openModal('大型イベント', `${dateStr()}です。重要なイベントが発生します。`, [
        {t:'確認して進む',f:()=>{randomEvent();render();}},
        {t:'今日はここで止める',f:()=>{render();}}
      ]);
    }
  }
}

}

function runMockExam(ex){
  ensureExpansion();
  const rows=Object.keys(g.people).map(k=>({k,name:g.people[k].name,score:npcExamScore(k)+Math.floor(Math.random()*11)-5}));
  rows.push({k:'me',name:'あなた',score:playerExamScore()+Math.floor(Math.random()*9)-4});
  rows.sort((a,b)=>b.score-a.score);
  const rank=rows.findIndex(x=>x.k==='me')+1;
  const prev=g.classRank;
  g.classRank=rank;
  g.examHistory.push({day:g.day,name:ex.name,score:rows.find(x=>x.k==='me').score,rank,total:rows.length,rows:rows.map(x=>({k:x.k,score:x.score}))});
  if(g.examHistory.length>10)g.examHistory.shift();
  const delta=prev?prev-rank:0;
  g.reputation=clamp(g.reputation+(rank<=3?4:rank>=10?-4:0));
  if(delta>0)addLog(`${ex.name}で${Math.abs(delta)}ランク上昇。クラス内で評価が上がった。`,'special');
  else if(delta<0)addLog(`${ex.name}で${Math.abs(delta)}ランク下落。周囲との差を感じた。`,'bad');
  else addLog(`${ex.name}を受験。クラス順位 ${rank}位 / ${rows.length}人。`,'special');
  const rival=g.people.tetsu;
  if(rival){const rr=rows.find(x=>x.k==='tetsu');if(rr&&rows.find(x=>x.k==='me').score>rr.score){g.npcWins.tetsu=(g.npcWins.tetsu||0)+1;addLog('てつに模試で勝った。ライバル関係が熱くなった。','good');}else if(rr){g.npcWins.tetsu=(g.npcWins.tetsu||0)-1;addLog('てつに模試で先を越された。悔しさが残った。','bad');}}
  if(rank<=3) addClue('模試上位に入ったことで、周囲からの見られ方が変わり始めた。',2);
  if(rank>=9) addClue('順位低下が人間関係にも影響するかもしれない。',1);
  openModal(ex.name,`あなたは ${rank}位 / ${rows.length}人\n得点 ${rows.find(x=>x.k==='me').score}\n${rank<=3?'上位勢として注目され始めた。':rank<=7?'まずまずの位置。ここから伸ばせる。':'危機感が必要な位置。'}`,[{t:'結果を見る',f:()=>{render();}}]);
}

  {t:'結果を確定する',f:()=>{addLog('早稲田の学部別入試シミュレーションを行った。','special');render();if(passed.length){openModal('合格発表',passed.map(x=>x.name+'：合格').join('\n'),[{t:'大学生活へ',f:()=>universityStart()}]);}else{baseFinish2();}}}
 ]);
}
function randomLifeEvent(){
 ensureExpansion2();if(g.day<20||Math.random()>0.10)return false;
 const events=[
  ['偶然の再会',()=>{const ks=Object.keys(g.people);const k=ks[Math.floor(Math.random()*ks.length)];g.people[k].mood=clamp(g.people[k].mood+10);g.people[k].aff=clamp(g.people[k].aff+4);rememberPlayer(k,'偶然再会して話した','出来事');addLog(`${g.people[k].name}と街で偶然会った。予定外の再会だった。`,'special')}],
  ['参考書が当たる',()=>{g.money-=2800;g.eng+=2;g.jpn+=1;addLog('たまたま買った参考書が自分にかなり合っていた。','good')}],
  ['体調を崩す',()=>{g.health=clamp(g.health-10);g.energy=clamp(g.energy-12);addLog('突然体調を崩した。数日は無理ができない。','bad')}],
  ['SNSでバズる',()=>{g.reputation=clamp((g.reputation||50)+7);addLog('勉強記録がSNSで少し話題になり、予備校でも知られるようになった。','special')}],
  ['家族からの支援',()=>{g.money+=10000;g.mental=clamp(g.mental+5);addLog('家族から「無理しすぎるな」と少し支援が届いた。','good')}],
  ['予定外の誘い',()=>{const ks=Object.keys(g.people).filter(k=>g.people[k].aff>20);if(ks.length){const k=ks[Math.floor(Math.random()*ks.length)];g.people[k].mood=clamp(g.people[k].mood+8);rememberPlayer(k,'急な誘いに応じた','出来事');addLog(`${g.people[k].name}から急な誘いが来た。`,'special')}}],
  ['模試会場でトラブル',()=>{g.mental=clamp(g.mental-5);g.reputation=clamp((g.reputation||50)-2);addLog('模試会場で小さなトラブル。集中が乱れた。','bad')}]
 ];
 const e=events[Math.floor(Math.random()*events.length)];g.lifeEvents.push({day:g.day,name:e[0]});if(g.lifeEvents.length>30)g.lifeEvents.shift();openModal('ランダムイベント：'+e[0],'予定表にはなかった出来事が起きた。',[{t:'対応する',f:()=>{e[1]();advance()} }]);return true;
}
function universityStart(){
 ensureExpansion2();g.university={active:true,day:0,year:1,major:(g.facultyResults.find(x=>x.pass)||g.facultyResults[0]||{name:'商学部'}).name,credits:0,gpa:0,career:0,club:0,network:0};addLog(`早稲田大学 ${g.university.major}の生活が始まった。`,'special');openModal('大学生活編スタート',`浪人生活の先に、大学生活が始まった。\n学部：${g.university.major}\nここからは勉強だけでなく、友人・サークル・就活も動く。`,[{t:'大学生活を始める',f:()=>{render();universityDay()}}]);
}
function universityDay(){
 if(!g.university.active)return;
 g.university.day++;g.day++;
 const u=g.university;u.credits+=Math.random()<.72?1:0;u.gpa=clamp(u.gpa+(Math.random()<.55?.05:-.02),0,4);u.network=clamp(u.network+(Math.random()<.5?1:0));u.club=clamp(u.club+(Math.random()<.25?2:0));
 if(u.day%30===0){u.career=clamp(u.career+(u.gpa>=3?2:1));addLog(`大学${u.day}日目：単位 ${u.credits} / GPA ${u.gpa.toFixed(2)}。`,'good')}
 if(u.day%45===0&&Math.random()<.7){const e=['サークルで仲間が増えた','授業で気の合う人と知り合った','インターン情報を教えてもらった','学園祭の企画に参加した','アルバイト先で新しい縁ができた'][Math.floor(Math.random()*5)];u.network=clamp(u.network+3);addLog(e,'special')}
 if(Math.random()<.08){const e=['旅行に誘われた','財布を落としかけた','先輩から就活の話を聞いた','興味のある企業説明会を見つけた'][Math.floor(Math.random()*4)];addLog(e,'special')}
 if(u.day>=365){u.year=2;openModal('大学2年目へ',`1年目終了。\n単位 ${u.credits} / GPA ${u.gpa.toFixed(2)} / 人脈 ${u.network}\n2年目は就活・専門性・人間関係がさらに重要になる。`,[{t:'2年目へ進む',f:()=>{u.day=365;universitySecondYear()}}]);return}
 if(u.day%30===0)render();setTimeout(universityDay,15);
}
function universitySecondYear(){
 const u=g.university;u.day++;
 if(u.day%30===0){u.credits+=1;u.gpa=clamp(u.gpa+(Math.random()<.6?.04:-.03),0,4);u.career=clamp(u.career+(u.gpa>=3?3:1));u.network=clamp(u.network+1);addLog(`大学2年目：専門科目と将来設計が進んだ。GPA ${u.gpa.toFixed(2)}。`,'special');render()}
 if(u.day>=730){u.active=false;openModal('大学2年目終了',`${u.major}\n単位 ${u.credits}\nGPA ${u.gpa.toFixed(2)}\n人脈 ${u.network}\nキャリア準備 ${u.career}\n\n浪人から始まった物語は、大学2年目まで続いた。`,[{t:'最初に戻る',f:()=>resetGame()}]);return}
 setTimeout(universitySecondYear,15);
}
const baseNpcDeepTick2=npcDeepTick;
npcDeepTick=function(){baseNpcDeepTick2();npcDramaTick();};
const baseRandomEvent2=randomEvent;
randomEvent=function(){if(g.university&&g.university.active)return; if(randomLifeEvent())return; baseRandomEvent2();};
const baseRelActionV32=relActionV3;
relActionV3=function(k,action){
 const p=g.people[k]; if(action!=='line') rememberPlayer(k, action==='date'?'一緒に遊んだ':action==='study'?'一緒に勉強した':action==='talk'?'悩みを相談した':action==='lunch'?'一緒に昼飯を食べた':action==='return'?'帰り道を一緒に過ごした':action==='gift'?'プレゼントを渡した':'交流した');
 const before=p.state;const out=baseRelActionV32(k,action);if(before!==p.state){p.relationshipHistory.push({day:g.day,from:before,to:p.state});}return out;
};
const baseFinish2=finish;
finish=function(){
 ensureExpansion2(); ensureExpansion3();
 if(g.university&&g.university.active)return;
 fullExam();
};
const baseRender2=render;
render=function(){baseRender2();ensureExpansion2();const h=document.getElementById('history');if(h){let old=document.getElementById('relationshipGraphBox');if(!old){old=document.createElement('div');old.id='relationshipGraphBox';h.appendChild(old)}old.innerHTML=relationshipGraphHtml();let fm=document.getElementById('facultyResultBox');if(!fm){fm=document.createElement('div');fm.id='facultyResultBox';h.appendChild(fm)}fm.innerHTML=g.facultyResults.length?`<div class="eventcard"><b>早稲田・学部別入試結果</b><div>${g.facultyResults.map(x=>`${x.name}：${x.score}点相当 — ${x.pass?'合格圏':'不合格圏'}`).join('<br>')}</div></div>`:'';if(g.university&&g.university.active){let ub=document.getElementById('universityBox');if(!ub){ub=document.createElement('div');ub.id='universityBox';h.appendChild(ub)}ub.innerHTML=`<div class="eventcard"><b>大学生活</b><div>学部：${g.university.major} / ${g.university.year}年目</div><div>単位 ${g.university.credits} / GPA ${g.university.gpa.toFixed(2)} / 人脈 ${g.university.network} / キャリア ${g.university.career}</div></div>`;}}
};


/* ===== EXPANSION PACK 3: SNS / books / forgetting / hidden stats / full exam / replay ===== */
function ensureExpansion3(){
 g.sns=g.sns||{posts:[],followers:0,following:0};
 g.books=g.books||{}; g.bookShelf=g.bookShelf||[]; g.forgetting=g.forgetting||{eng:0,jpn:0,world:0,writing:0};
 g.studyQuality=g.studyQuality||{input:0,practice:0,past:0,review:0};
 g.hidden=g.hidden||{confidence:50,anxiety:25,pressure:20,loneliness:15,selfEfficacy:50,fatigue:0};
 g.randomEventsSeen=g.randomEventsSeen||0; g.achievements=g.achievements||[]; g.runCount=g.runCount||1;
 g.replayUnlocks=g.replayUnlocks||[];
 const defs={
  target1900:{name:'英単語ターゲット系',subject:'eng',cost:1200,power:1.5,kind:'input'},
  grammar:{name:'英文法・語法問題集',subject:'eng',cost:1600,power:1.8,kind:'practice'},
  kobun:{name:'古文単語帳',subject:'jpn',cost:1100,power:1.5,kind:'input'},
  kanbun:{name:'漢文句法',subject:'jpn',cost:1200,power:1.4,kind:'practice'},
  world1:{name:'世界史一問一答',subject:'world',cost:1400,power:1.8,kind:'input'},
  world2:{name:'世界史論述問題集',subject:'world',cost:1800,power:2.1,kind:'practice'},
  wasepast:{name:'早稲田過去問',subject:'writing',cost:2200,power:2.4,kind:'past'},
  review:{name:'総復習ノート',subject:'review',cost:900,power:1.8,kind:'review'}
 };
 Object.entries(defs).forEach(([k,v])=>{if(!g.books[k])g.books[k]={...v,mastery:0,uses:0}});
}
const bookDefs=()=>Object.values(g.books||{});
function buyBook(k){ensureExpansion3();const b=g.books[k];if(!b)return;if(g.bookShelf.includes(k)){addLog(`${b.name}はすでに持っている。`);render();return}if(g.money<b.cost){addLog('参考書を買うお金が足りない。','bad');render();return}g.money-=b.cost;g.bookShelf.push(k);addLog(`${b.name}を購入した。`,'good');render();}
function useBook(k){ensureExpansion3();const b=g.books[k];if(!b||!g.bookShelf.includes(k)){addLog('その参考書を持っていない。','bad');render();return}if(g.energy<8){addLog('集中力が足りない。','bad');render();return}g.energy-=8;b.uses++;b.mastery=clamp(b.mastery+Math.random()*8+4);if(b.kind==='input'){g.studyQuality.input+=1;g[b.subject]=clamp(g[b.subject]+b.power*(.6+b.mastery/160));}
else if(b.kind==='practice'){g.studyQuality.practice+=1;g[b.subject]=clamp(g[b.subject]+b.power*(.7+b.mastery/180));}
else if(b.kind==='past'){g.studyQuality.past+=1;g.writing=clamp(g.writing+b.power);g.eng=clamp(g.eng+b.power*.55);}
else {g.studyQuality.review+=1;Object.keys(g.forgetting).forEach(s=>g.forgetting[s]=Math.max(0,g.forgetting[s]-3));}
g.hidden.selfEfficacy=clamp(g.hidden.selfEfficacy+1);g.totalStudy+=.8;addLog(`${b.name}を使って勉強した。習熟度 ${Math.round(b.mastery)}%。`,'good');advance();}
function booksHtml(){ensureExpansion3();return `<div class="eventcard"><b>参考書</b><div class="relrow">${bookDefs().map((b,k)=>`<button class="relbtn" onclick="${g.bookShelf.includes(Object.keys(g.books).find(x=>g.books[x]===b))?'useBook(\''+Object.keys(g.books).find(x=>g.books[x]===b)+'\')':'buyBook(\''+Object.keys(g.books).find(x=>g.books[x]===b)+'\')'}">${b.name}<br><small>${g.bookShelf.includes(Object.keys(g.books).find(x=>g.books[x]===b))?'使用':'購入 ¥'+b.cost}</small></button>`).join('')}</div><div class="muted" style="margin-top:5px">所持：${g.bookShelf.map(k=>g.books[k].name+' '+Math.round(g.books[k].mastery)+'%').join(' / ')||'なし'}</div></div>`}
function forgettingTick(){ensureExpansion3();if(g.day%7!==0)return;const q=g.studyQuality.review;Object.keys(g.forgetting).forEach(s=>{const base=s==='eng'?0.45:s==='jpn'?0.38:s==='world'?0.55:0.30;g.forgetting[s]=clamp(g.forgetting[s]+base*(q>5?.65:1));if(g.forgetting[s]>3&&g[s]!=null){g[s]=clamp(g[s]-base*.28)}});}
function qualityStudy(kind){ensureExpansion3();const map={input:['eng',1.3],practice:['writing',1.4],past:['eng',1.7],review:['world',1.1]};const [subject,power]=map[kind]||map.input;if(g.energy<10){addLog('集中力が足りない。','bad');return}g.energy-=10;g.totalStudy+=1;g.studyQuality[kind]++;g[subject]=clamp(g[subject]+power);g.hidden.selfEfficacy=clamp(g.hidden.selfEfficacy+(kind==='past'?2:1));addLog(`${kind==='input'?'インプット':kind==='practice'?'問題演習':kind==='past'?'過去問':'復習'}を重点的に行った。`,'good');advance();}
function hiddenTick(){ensureExpansion3();const h=g.hidden;h.fatigue=clamp(h.fatigue+(g.energy<30?3:-1));h.anxiety=clamp(h.anxiety+(g.day>250&&g.eng<70?1:0)+(g.mental<45?1:0)-(h.selfEfficacy>70?1:0));h.pressure=clamp(h.pressure+(g.day>280?1:0)-(g.health>75?1:0));h.loneliness=clamp(h.loneliness+(Object.values(g.people).filter(p=>p.aff>=35).length===0?1:-.5));h.confidence=clamp(40+g.hidden.selfEfficacy*.55-g.hidden.anxiety*.2+h.loneliness*-0.08);}
function hiddenHtml(){ensureExpansion3();const h=g.hidden;return `<div class="eventcard"><b>見えない心理状態</b><div>自信：${Math.round(h.confidence)} / 不安：${Math.round(h.anxiety)} / プレッシャー：${Math.round(h.pressure)}</div><div>疲労蓄積：${Math.round(h.fatigue)} / 孤独：${Math.round(h.loneliness)} / 自己効力感：${Math.round(h.selfEfficacy)}</div></div>`}
function snsTone(p){if(!p)return '一般';if(p.state==='セフレ')return '割り切った関係';if(p.state==='恋人')return '恋人';if(p.aff>=65)return '親しい';return '友達';}
function makeSNSPost(){ensureExpansion3();const me=['今日も自習室。','模試終わった。','世界史がやっと繋がってきた。','今日は休む。','早稲田過去問、難しい。','朝から勉強開始。'];const text=me[Math.floor(Math.random()*me.length)];const likes=Math.max(0,Math.round(g.sns.followers*.25+g.reputation*.35+Math.random()*12));g.sns.posts.unshift({day:g.day,author:'あなた',text,likes});g.sns.followers=clamp(g.sns.followers+Math.floor(Math.random()*4));addLog(`浪人生SNSに投稿。「${text}」 いいね ${likes}`,'special');render();}
function snsTick(){ensureExpansion3();if(Math.random()>.22)return;const keys=Object.keys(g.people);const k=keys[Math.floor(Math.random()*keys.length)],p=g.people[k];const posts=p.state==='恋人'?['今日ちょっと嬉しいことあった','一緒に頑張れる人がいるっていいな']:p.state==='セフレ'?['今日は暇。','最近忙しい。']:p.aff>=55?['今日も自習室','模試返ってきた','疲れたけど頑張る']:['眠い','明日から本気出す'];const text=posts[Math.floor(Math.random()*posts.length)];g.sns.posts.unshift({day:g.day,author:p.name,text,likes:Math.floor(Math.random()*25)});if(g.sns.posts.length>40)g.sns.posts.pop();if(p.state==='恋人'&&Math.random()<.08)addRumor(`${p.name}のSNS投稿が少し匂わせっぽい。`,'SNS');}
function snsHtml(){ensureExpansion3();return `<div class="eventcard"><b>浪人生SNS</b><div class="relrow"><button class="relbtn" onclick="makeSNSPost()">投稿する</button></div>${g.sns.posts.slice(0,8).map(x=>`<div style="padding:5px;border-bottom:1px solid #21262d"><b>${x.author}</b> <span class="muted">${x.day+1}日目</span><br>${x.text}<br><span class="muted">♥ ${x.likes}</span></div>`).join('')||'<span class="muted">まだ投稿はない。</span>'}</div>`}
function fullExam(){ensureExpansion3();const subjects=[['英語',g.eng],['国語',g.jpn],['世界史',g.world],['記述',g.writing]];let total=0;const result=subjects.map(([n,v])=>{const q=Math.max(0,Math.min(100,v-(g.forgetting[n==='英語'?'eng':n==='国語'?'jpn':n==='世界史'?'world':'writing']||0)*.5+Math.random()*12-6));total+=q;return [n,Math.round(q)]});const avg=total/4;const bonus=g.hidden.confidence*.06-g.hidden.anxiety*.04;const final=avg+bonus;const pass=final>=73;g.facultyResults=facultyExamData().map(f=>{const fit=(final*.55+g.eng*(f.bonus.eng-1)*20+g.world*(f.bonus.world-1)*15+Math.random()*8);return {...f,score:Math.round(fit),pass:fit>=72}});addLog(`早稲田入試本番：総合 ${Math.round(final)}点相当。`,'special');openModal('早稲田入試本番',result.map(x=>`${x[0]}：${x[1]}`).join('\n')+`\n\n心理補正：${bonus.toFixed(1)}\n総合：${Math.round(final)}\n${pass?'合格圏':'不合格圏'}`,[{t:'合格発表へ',f:()=>{if(pass)facultyExamModal();else baseFinish2();}}]);}
function replayAchievement(title){ensureExpansion3();if(!g.achievements.includes(title)){g.achievements.push(title);addLog(`実績解除：「${title}」`,'special');}}
function replayMode(){ensureExpansion3();const opts=[['通常','通常のバランス'],['HARD','成長が遅く、忘却が強い'],['CHAOS','ランダムイベントが大幅増加'],['ROMANCE','人間関係イベントが大幅増加']];openModal('次の周回モード',opts.map(x=>`${x[0]}：${x[1]}`).join('\n'),opts.map(x=>({t:x[0],f:()=>{g.runCount++;g.mode=x[0];g=JSON.parse(JSON.stringify(initial));ensureExpansion3();g.runCount++;if(x[0]!=='通常')g.mode=x[0];addLog(`${x[0]}モードで第${g.runCount}周を開始。`,'special');render()}})));}
function expansion3Tick(){ensureExpansion3();forgettingTick();hiddenTick();snsTick();if(g.mode==='HARD'){g.eng=clamp(g.eng-.12);g.jpn=clamp(g.jpn-.10);g.world=clamp(g.world-.14)}if(g.mode==='CHAOS'&&Math.random()<.25)randomLifeEvent();if(g.mode==='ROMANCE'&&Math.random()<.18)npcDramaTick();}
const _adv3=advance;
advance=function(){expansion3Tick();_adv3();};
const _sim3=simulateDay;
simulateDay=function(){_sim3();};
const _npc3=npcDeepTick;
npcDeepTick=function(){_npc3();};
const _render3=render;
render=function(){_render3();ensureExpansion3();const h=document.getElementById('history');if(h){let x=document.getElementById('expansion3Box');if(!x){x=document.createElement('div');x.id='expansion3Box';h.appendChild(x)}x.innerHTML=booksHtml()+snsHtml()+hiddenHtml()+`<div class="eventcard"><b>追加システム</b><div class="relrow"><button class="relbtn" onclick="fullExam()">🎓 早稲田入試本番</button><button class="relbtn" onclick="replayMode()">🔄 次周回モード</button></div></div><div class="eventcard"><b>勉強の質</b><div>インプット ${g.studyQuality.input} / 演習 ${g.studyQuality.practice} / 過去問 ${g.studyQuality.past} / 復習 ${g.studyQuality.review}</div><div>忘却：英 ${g.forgetting.eng.toFixed(1)} / 国 ${g.forgetting.jpn.toFixed(1)} / 世 ${g.forgetting.world.toFixed(1)} / 記述 ${g.forgetting.writing.toFixed(1)}</div></div>`}}
function openRelationshipGraph(){
 ensureExpansion2();
 const people=Object.entries(g.people);
 const rows=[];
 people.forEach(([k,p])=>{
   const score=p.aff+p.trust+p.close;
   if(score>=45 || p.state!=='未交流') rows.push(`<div class="eventcard"><b>${p.name}</b>　<span class="flag">${relationStage(p)}</span><br><span class="muted">好感 ${Math.round(p.aff)} / 信頼 ${Math.round(p.trust)} / 親密 ${Math.round(p.close)}</span></div>`);
 });
 const drama=g.npcDrama.slice(-10).reverse().map(d=>`<div class="eventcard">${g.people[d.a]?.name||d.a}　${d.type==='confession'?'❤️ 告白':d.type==='argument'?'💢 喧嘩':d.type==='breakup'?'💔 別れ':'🤝 仲直り'}　${g.people[d.b]?.name||d.b}</div>`).join('');
 openModal('💞 現在の恋愛・人間関係相関図',`<div style="max-height:65vh;overflow:auto">${relationshipGraphHtml()}<div style="margin-top:8px"><b>現在の関係</b>${rows.join('')||'<div class="muted">まだ大きな関係はない。</div>'}<b>最近のNPCイベント</b>${drama||'<div class="muted">まだない。</div>'}</div></div>`,[{t:'閉じる',f:()=>{render()}}]);
}

ensureExpansion3();

ensureExpansion2();
ensureExpansion();
ensureExpansion3();
render();
</script>
