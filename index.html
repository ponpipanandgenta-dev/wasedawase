<body>
<div class="app">
<header><div><h1>浪人シミュレーター <span class="sub">WASEDA RUN</span></h1><div class="sub">2026年度 — 早稲田合格を目指せ ・ 登場人物は全員18歳以上</div></div>
<div class="top"><button class="btn" onclick="saveGame()">保存</button><button class="btn" onclick="loadGame()">読込</button><button class="btn" onclick="resetGame()">最初から</button></div></header>

<section class="hero hero-combined" aria-label="げんた・今日の状況">

<!-- ===== MAIN DASHBOARD ===== -->
<section class="dashboard9" aria-label="ゲームメニュー">

  <button class="dash-tile" onclick="openPanel('action',this)"><span class="tile-icon">⚡</span><span><b>今日の行動</b><small>勉強・休養・バイト</small></span></button>
  <button class="dash-tile" onclick="openPanel('people',this)"><span class="tile-icon">👥</span><span><b>人間関係</b><small>友達・恋愛・ライバル</small></span></button>
  <button class="dash-tile romance" onclick="openRelationshipGraph()"><span class="tile-icon">💗</span><span><b>恋愛相関図</b><small>現在の関係を確認</small></span></button>
  <button class="dash-tile" onclick="openPanel('calendar',this)"><span class="tile-icon">🗓️</span><span><b>年間予定</b><small>模試・共テ・入試</small></span></button>
  <button class="dash-tile" onclick="openPanel('world',this)"><span class="tile-icon">🌏</span><span><b>世界</b><small>場所・噂・約束</small></span></button>
  <button class="dash-tile" onclick="openInbox()"><span class="tile-icon">💬</span><span><b>LINE / SNS</b><small>届いた連絡を確認</small></span><em id="dashUnread"></em></button>

<section class="main-stage">
  <div class="stage-left">
    <div class="card compact-card" id="actionCard" style="display:none">
      <div class="section-head"><div><h3>今日の行動</h3><span class="muted">1日に使える行動力をどう使う？</span></div><span class="mini-badge" id="energyBadge">行動力</span></div>
      <div class="actions" id="actions"></div>
    </div>

    <div class="card compact-card panel-card" id="statusCard">
      <div id="status">
        <div class="stats" id="stats"></div>
      </div>
      <div id="people" style="display:none"><div class="muted" style="margin-bottom:7px">行動すると好感・信頼・親密度が変化。関係が進むと固有イベントが解禁。</div><div class="people" id="peopleList"></div></div>
      <div id="calendar" style="display:none"><div class="timeline" id="monthEvents"></div><div style="height:7px"></div><div class="calendar" id="calendarGrid"></div></div>
      <div id="world" style="display:none"><h3>今日どこへ行く？</h3><div class="mapgrid" id="map"></div><div class="eventcard"><b>噂・人間関係</b><div id="rumors"></div></div><div class="eventcard"><b>約束</b><div id="promises"></div></div><div class="eventcard"><b>世界の裏側</b><div id="deepWorld"></div></div></div>
      <div id="history" style="display:none"><div class="summary" id="summary"></div><div class="eventcard"><b>この1年の出来事</b><div id="milestones"></div></div><div class="eventcard"><b>今回のルート・伏線</b><div id="routeInfo"></div></div></div>
    </div>
  </div>

  <div class="stage-right">
    <div class="card log-card">
      <div class="section-head"><div><h3>生活ログ</h3><span class="muted">最近起きたことがここに残る</span></div><span class="mini-badge live">LIVE</span></div>
      <div class="log" id="log"></div>

</section>


<div class="graph-modal" id="graphModal" onclick="if(event.target===this)closeRelationshipGraph()">
  <div class="graph-box">
    <div class="graph-head"><div><h2>💗 恋愛・人間関係 相関図</h2><span>現在の関係値をもとに表示</span></div><button class="close-x" onclick="closeRelationshipGraph()">×</button></div>
    <div class="graph-canvas" id="relationshipGraph"></div>
    <div class="graph-legend"><span>💗 恋愛</span><span>💙 友達</span><span>🧡 ライバル</span><span>🩶 距離あり</span></div>
    <div class="npc-rel-box"><b>NPC同士の関係</b><div id="graphNpcRomances"></div></div>
  </div>
</div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="choices" id="choices"></div></div></div>

<script>
const initial={
day:0, money:80000, energy:80, mental:75, health:80,
eng:48,jpn:42,world:50,writing:40,
study:0, streak:0, totalStudy:0, saved:false, unreadLines:0, lineInbox:[], npcScores:{},
people:{
 rinka:{name:"りんか",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 mokujyo:{name:"もくじょ",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 tetsu:{name:"てつ",type:"ライバル",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},

 ryuto:{name:"りゅうと",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 yuta:{name:"ゆうた",type:"明るい友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 yugo:{name:"ゆうご",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 daisuke:{name:"だいすけ",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 rasuro:{name:"ラスロ",type:"イケメン",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 takeshi:{name:"たけし",type:"アホな友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 rise:{name:"りせ",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 yuuri:{name:"ゆうり",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 mihana:{name:"みはな",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 mimoe:{name:"みもえ",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 kurumi:{name:"くるみ",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99}
},
logs:[{t:"4月1日",x:"今日から浪人生活が始まった。第一志望は早稲田。",c:"special"}]
};
let g=JSON.parse(JSON.stringify(initial));
const dow=["水","木","金","土","日","月","火"];
const months=[30,31,30,31,31,30,31,30,31,30,31,31];

function $(id){return document.getElementById(id)}
function dateObj(){let d=new Date(2026,3,1);d.setDate(d.getDate()+g.day);return d}
function dateStr(){let d=dateObj();return `${d.getMonth()+1}月${d.getDate()}日（${dow[g.day%7]}）`}
function clamp(n,a=0,b=100){return Math.max(a,Math.min(b,n))}
const romanceCandidates=new Set(["rinka","rise","yuuri","mihana","mimoe","kurumi"]);
function isRomance(k){return romanceCandidates.has(k)}
function addLog(x,c=""){g.logs.unshift({t:dateStr(),x,c}); if(g.logs.length>80)g.logs.pop()}
function stat(label,val,desc){return `<div class="stat"><span>${label}</span><b>${Math.round(val)}</b><div class="bar"><div class="fill" style="width:${clamp(val)}%"></div></div><span>${desc}</span></div>`}

function render(){
$("date").textContent=dateStr();
let p=g.day<30?"基礎固め":g.day<120?"夏までの伸長期":g.day<210?"秋の実戦期":g.day<285?"冬の完成期":"入試本番";
$("phase").textContent=p;
$("days").textContent=`本番まで ${365-g.day} 日 / 勉強 ${Math.floor(g.totalStudy)} 時間`;
$("stats").innerHTML=
stat("英語",g.eng,"長文・文法・語彙")+stat("国語",g.jpn,"現代文・古文・漢文")+
stat("世界史",g.world,"通史・論述")+stat("記述力",g.writing,"答案作成")+
stat("体力",g.health,"生活習慣")+stat("メンタル",g.mental,"継続力")+
stat("集中力",g.energy,"今日の行動力")+stat("勉強習慣",clamp(g.streak*4),"継続日数");

$("actions").innerHTML=`
<button class="action" onclick="study('eng')"><strong>📘 英語を勉強</strong><small>+英語 / 疲労</small></button>
<button class="action" onclick="study('jpn')"><strong>📕 国語を勉強</strong><small>+国語 / 疲労</small></button>
<button class="action" onclick="study('world')"><strong>📗 世界史を勉強</strong><small>+世界史 / 疲労</small></button>
<button class="action" onclick="study('all')"><strong>📚 3科目演習</strong><small>総合力 / 大疲労</small></button>
<button class="action" onclick="social()"><strong>💬 人と会う</strong><small>好感度 / メンタル</small></button>
<button class="action" onclick="rest()"><strong>🛌 休む</strong><small>体力 / メンタル</small></button>
<button class="action" onclick="partTime()"><strong>💴 バイト</strong><small>お金 / 時間</small></button>
<button class="action" onclick="simulateDay()"><strong>⏩ 1日進める</strong><small>何もしない</small></button>
<button class="action skip" onclick="skipDays(3)"><strong>⏭️ 3日進める</strong><small>高速シミュレーション</small></button>
<button class="action skip" onclick="skipDays(7)"><strong>⏭️ 1週間進める</strong><small>重要イベントで停止</small></button>
<button class="action skip" onclick="skipDays(30)"><strong>⏭️ 1ヶ月進める</strong><small>月間イベントを確認</small></button>
<button class="action skip" onclick="skipToMajor()"><strong>🚀 次の大型イベント</strong><small>模試・入試などまで</small></button>`;

const sideExam=$("sideExam"); if(sideExam) sideExam.innerHTML=examText();
const sideMoney=$("sideMoney"); if(sideMoney) sideMoney.textContent=`¥${g.money.toLocaleString()}`;
const sideGoal=$("sideGoal"); if(sideGoal) sideGoal.innerHTML=goalText();
const sideRanking=$("sideRanking"); if(sideRanking) sideRanking.innerHTML=rankingText();
const previousOpen=document.querySelector('.person.open')?.dataset.key;
const faceForPerson=(k,p)=>{const female=new Set(['rinka','rise','yuuri','mihana','mimoe','kurumi']); const maleFaces=['🙎‍♂️','🧍‍♂️','🕺','👨']; const femaleFaces=['👩','💃','🧍‍♀️','👩‍🎓']; if(k==='genta')return '😁'; const pool=female.has(k)?femaleFaces:maleFaces; let n=0; for(let i=0;i<k.length;i++)n+=k.charCodeAt(i); return pool[n%pool.length];};
$("peopleList").innerHTML=Object.entries(g.people).map(([k,p])=>{
 let cooldown=Math.max(0,3-(g.day-p.last));
 return `<div class="person ${previousOpen===k?'open':''}" data-key="${k}">
 <button class="person-toggle" onclick="togglePerson('${k}')" aria-expanded="${previousOpen===k?'true':'false'}"><span class="person-face-emoji">${faceForPerson(k,p)}</span><span class="person-title"><b>${p.name}</b><small>${relationLabel(p)} · 好感 ${p.aff}</small></span><span class="person-chevron">${previousOpen===k?'−':'＋'}</span></button>
 <div class="person-details" ${previousOpen===k?'':'hidden'}>
 <div class="meter"><span>好感</span><div class="bar"><div class="fill" style="width:${p.aff}%"></div></div><b>${p.aff}</b></div>
 <div class="meter"><span>信頼</span><div class="bar"><div class="fill" style="width:${p.trust}%"></div></div><b>${p.trust}</b></div>
 <div class="meter"><span>親密</span><div class="bar"><div class="fill" style="width:${p.close}%"></div></div><b>${p.close}</b></div>
 <div class="muted">機嫌 ${p.mood} / ${p.type} ${p.handhold?'<span class="pill pink">手をつないだ</span>':''} ${p.hug?'<span class="pill pink">ハグ済み</span>':''}</div>
 <div class="relrow"><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','line')">💬 LINE ${p.unread?'<span class="unread">未読</span>':''}</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','study')">📚 勉強</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','lunch')">🍱 昼飯</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','return')">🚶 帰り道</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','date')">🎡 遊ぶ</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','talk')">🗣 相談</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','gift')">🎁 プレゼント</button><button class="relbtn" onclick="apologize('${k}')">🙏 謝る</button><button class="relbtn" onclick="distance('${k}')">↔ 距離を置く</button></div>
 </div></div>`
}).join("");
$("calendarGrid").innerHTML=monthNames.map((m,mi)=>{ let start=mi===0?0:months.slice(0,mi).reduce((a,b)=>a+b,0); let end=start+months[mi]-1; let events=[]; if(mi===9) events.push("共テ直前"); if(mi===10) events.push("共通テスト・出願"); if(mi===11) events.push("早稲田入試"); let active=g.day>=start&&g.day<=end; return `<div class="monthCard ${active?"active":""}"><b>${m}</b><span>${start+1}〜${end+1}日</span>${events.map(e=>`<small>${e}</small>`).join("")}</div>`; }).join("");
$("log").innerHTML=g.logs.slice(0,7).map(l=>`<div class="event ${l.c}"><span class="muted">${l.t}</span><br>${l.x}</div>`).join("");
}

function togglePerson(key){
 const target=document.querySelector(`.person[data-key="${key}"]`);
 if(!target)return;
 const wasOpen=target.classList.contains('open');
 document.querySelectorAll('#peopleList .person').forEach(el=>{el.classList.remove('open');const d=el.querySelector('.person-details');const b=el.querySelector('.person-toggle');if(d)d.hidden=true;if(b)b.setAttribute('aria-expanded','false');const c=el.querySelector('.person-chevron');if(c)c.textContent='＋';});
 if(!wasOpen){target.classList.add('open');const d=target.querySelector('.person-details');const b=target.querySelector('.person-toggle');if(d)d.hidden=false;if(b)b.setAttribute('aria-expanded','true');const c=target.querySelector('.person-chevron');if(c)c.textContent='−';}
}
function examText(){
let avg=(g.eng+g.jpn+g.world+g.writing)/4;
let grade=avg>=78?"A":avg>=68?"B":avg>=58?"C":avg>=48?"D":"E";
return `<div style="font-size:42px;font-weight:800">${grade}判定</div><p>総合力 ${avg.toFixed(1)}</p>
<div class="muted">早稲田 商学部 / 文化構想</div><div class="progress">本番想定：${g.day<250?"まだ伸ばせる":"実戦力が重要な時期"}</div>`;
}
function goalText(){
let d=dateObj();let goals=g.day<90?["英単語を固める","世界史通史を一周","古文単語を継続"]:g.day<210?["早稲田レベル演習","過去問研究","弱点補強"]:["過去問演習","答案の精度","睡眠と体調管理"];
return `<b>${goals[g.day%goals.length]}</b><p class="muted">行動によってステータスと人間関係が変化します。</p>`;
}
function showTab(id,b){["status","people","calendar","world","history"].forEach(x=>$(x).style.display=x===id?"block":"none");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on")}

function study(type){
if(g.energy<18){addLog("今日はもう集中力が残っていない。休むべきだ。","bad");render();return}
let gain= type==="all"?2.2:4.2;
let cost=type==="all"?28:17;
if(type==="all"){g.eng+=gain;g.jpn+=gain;g.world+=gain;g.writing+=1.2}
else g[type]+=gain;
g[type==="all"?"eng":type]=type==="all"?g.eng:clamp(g[type]);
g.energy-=cost;g.health-=type==="all"?4:2;g.totalStudy+=type==="all"?5:2.5;g.streak++;
addLog(type==="all"?"3科目の実戦演習をやり切った。":`${{eng:"英語",jpn:"国語",world:"世界史"}[type]}を集中して勉強した。`,"good");
randomEvent();advance();
}
function rest(){g.energy=95;g.health=clamp(g.health+9);g.mental=clamp(g.mental+8);g.streak=0;addLog("今日は休養日。明日に備えて回復した。");advance()}
function social(){

/* ===== FAST FORWARD ===== */
function skipDays(n){
  ensureV3();
  if(g.day>=364){finish();return;}
  const start=g.day;
  let stopped=false, reason='';
  for(let i=0;i<n && g.day<364;i++){
    // Simulate one ordinary day without rendering after every step.
    autonomousWorld();
    g.energy=clamp(g.energy+15);
    g.health=clamp(g.health-1);
    g.mental=clamp(g.mental-1);
    if(Math.random()<0.24) randomEvent();
    g.day++;
    if(g.day%7===0){g.money-=3500;addLog('週の生活費として¥3,500使った。');}
    if(g.day%30===0){g.eng+=1;g.jpn+=1;g.world+=1;addLog('1か月の継続効果で基礎力が少し伸びた。','good');monthlyEvent();}
    // Promises and important relationship events interrupt the skip.
    const due=g.promises.find(pr=>!pr.done&&pr.day===g.day);
    if(due){stopped=true;reason='約束の日';break;}
    // Stop at major exam days.
    if([305,315,325,335].includes(g.day)){stopped=true;reason='大型イベント';break;}
  }
  const moved=g.day-start;
  addLog(`${moved}日間を高速シミュレーションした。${stopped?'重要イベントで停止。':''}`,'special');
  render();
  if(g.day>=364){finish();return;}
  const due=g.promises.find(pr=>!pr.done&&pr.day===g.day);
  if(due){checkPromises();return;}
  if(stopped){
    if([305,315,325,335].includes(g.day)){
      openModal('大型イベント', `${dateStr()}です。重要なイベントが発生します。`, [
        {t:'確認して進む',f:()=>{randomEvent();render();}},
        {t:'今日はここで止める',f:()=>{render();}}
      ]);
    }
  }
}
function skipToMajor(){
  const targets=[30,60,90,120,150,180,210,240,270,285,305,315,325,335,364];
  const next=targets.find(d=>d>g.day);
  if(!next){finish();return;}
  skipDays(Math.max(1,next-g.day));
}

const deepDefaults={
  npc:{}, npcLinks:[], delayed:[], clues:[], route:{study:0,social:0,romance:0,work:0,recovery:0,lonely:0}, achievements:[], examHistory:[], decisions:[], worldSeed:Math.floor(Math.random()*999999)

function ensureDeep(){
  Object.keys(deepDefaults).forEach(k=>{if(g[k]==null) g[k]=JSON.parse(JSON.stringify(deepDefaults[k]))});
  const target={rinka:'早稲田',mokujyo:'同志社',tetsu:'慶應',ryuto:'関西学院',yuta:'関西学院',yugo:'立命館',daisuke:'大阪公立',rasuro:'早稲田',takeshi:'関大',rise:'慶應',yuuri:'早稲田',mihana:'上智',mimoe:'関西学院',kurumi:'立命館'};
  Object.entries(g.people).forEach(([k,p],i)=>{
    if(!g.npc[k]) g.npc[k]={study:35+(i*7)%45,stress:25+(i*11)%35,energy:70,goal:55+(i*5)%40,target:target[k]||'関関同立',career:'受験継続',daysActive:0,route:'未定'};
  });
  if(!g.npcLinks.length){
    const ids=Object.keys(g.people); for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) if((i*7+j*3)%9===0) g.npcLinks.push({a:ids[i],b:ids[j],score:20+(i+j)%35,kind:'友人',last:g.day});

function scheduleDeep(text,days,fn){g.delayed.push({due:g.day+days,text,done:false,fn});}

function routeTick(){
  const r=g.route;
  if(g.totalStudy>=120)r.study++;
  if(Object.values(g.people).filter(p=>p.aff>=55).length>=3)r.social++;
  if(Object.values(g.people).some(p=>p.state==='恋人'))r.romance++;
  if(g.totalStudy<70 && g.money>110000)r.work++;
  if(g.health>=80&&g.mental>=75)r.recovery++;
  if(Object.values(g.people).every(p=>p.aff<20))r.lonely++;
}
function npcDeepTick(){
  ensureDeep();
  Object.entries(g.npc).forEach(([k,n],i)=>{
    const p=g.people[k]; const effort=(p.mood>60?1:0)+(i%3===0?1:0);
    n.energy=clamp(n.energy-(2+Math.random()*3));
    n.stress=clamp(n.stress+(n.energy<30?3:Math.random()<.4?-2:1));
    if(n.energy>25 && n.stress<78){n.study=clamp(n.study+0.35+effort*.18);n.goal=clamp(n.goal+(Math.random()<.15?.7:0));}
    else n.study=clamp(n.study-0.15);
    if(n.stress>88&&n.career==='受験継続'){n.career='休養中';addClue(`${p.name}がかなり疲れているらしい。`,2);}
    if(n.career==='休養中'&&n.stress<60)n.career='受験継続';
    n.daysActive++;
    if(n.study>82&&n.target==='早稲田'&&Math.random()<.08){addLog(`${p.name}が早稲田対策をかなり進めている。`,'special');addClue(`${p.name}の勉強量が急に伸びている。`,2)}
  });
  g.npcLinks.forEach(link=>{
    if(g.day-link.last<3)return; link.last=g.day; link.score=clamp(link.score+(Math.random()<.55?1:-1),0,100);
    const a=g.people[link.a],b=g.people[link.b];
    if(link.score>=72&&link.kind==='友人'){link.kind='親しい';addClue(`${a.name}と${b.name}がよく一緒にいるらしい。`,2)}
    if(link.score>=88&&link.kind==='親しい'){link.kind='特別';addLog(`${a.name}と${b.name}の関係がかなり近くなっている。`,'special')}
    if(link.score<15&&link.kind!=='友人'){link.kind='距離';addClue(`${a.name}と${b.name}の間に少し距離ができたらしい。`,2)}
  });
  // Player choices create consequences that arrive later.
  if(g.totalStudy>80 && !g.flags.deepStudyAdvice){g.flags.deepStudyAdvice=true;scheduleDeep('夏の努力が秋の実戦力として返ってきた。',55,()=>{g.eng=clamp(g.eng+3);g.writing=clamp(g.writing+2);addLog('夏の積み上げが秋の答案力に繋がった。','good')});addClue('夏の勉強量が後半に影響する気配がある。',3)}
  if(g.route.social>=2 && !g.flags.socialNetwork){g.flags.socialNetwork=true;scheduleDeep('人間関係が思わぬ情報を運んできた。',35,()=>{g.world=clamp(g.world+2);addLog('友人経由で世界史の勉強法を教えてもらった。','good')});}
  if(g.route.lonely>=3 && !g.flags.lonely){g.flags.lonely=true;scheduleDeep('孤立がメンタルに影響し始めた。',20,()=>{g.mental=clamp(g.mental-7);addLog('人と話さない日が続き、メンタルが少し落ちた。','bad')});}
  routeTick();
}

/* Multi-ending evaluator: same exam result can produce different life outcomes. */
function finish(){
  ensureDeep(); let avg=(g.eng+g.jpn+g.world+g.writing)/4;
  const pass=avg>=73&&g.mental>=35;
  const r=g.route; let title,desc;
  if(pass&&r.romance>=3&&r.social>=2) {title='早稲田合格 × 最高の一年';desc='受験も人間関係も両方を投げなかった。';}
  else if(pass&&r.study>=5&&r.lonely>=3){title='孤高の合格';desc='人間関係を削ってでも勉強を積み上げ、結果を掴んだ。';}
  else if(pass&&r.work>=3){title='働きながら合格';desc='時間を切り売りしながら、最後まで受験を続けた。';}
  else if(pass){title='早稲田大学 合格';desc='積み上げが結果になった。';}
  else if(!pass&&r.social>=4){title='人間関係に救われた一年';desc='合格には届かなかったが、一人では得られなかったものが残った。';}
  else if(!pass&&r.recovery>=4&&g.mental>=65){title='立て直しの一年';desc='結果よりも、自分を壊さず一年を走り切った。';}
  else {title='もう一年';desc='届かなかった。ただし、ここからの選択で結果は変えられる。';}
  openModal('365日目 — '+title,`${desc}\n\n総合力 ${avg.toFixed(1)} / 勉強 ${Math.floor(g.totalStudy)}h / メンタル ${Math.round(g.mental)}`,[{t:'もう一度プレイ',f:()=>resetGame()}]);
}

const CHARACTER_ART={
  female:{url:'https://img.itch.zone/aW1nLzcyOTg2MDAucG5n/original/2SaMYA.png',credit:'Potat0Master'},
  male:{url:'https://img.itch.zone/aW1hZ2UvMTI3MTI2Ny83NDAyODQ2LnBuZw%3D%3D/794x1000/tgERLS.png',credit:'Potat0Master'}
};
const FEMALE_NAMES=new Set(['りんか','りせ','ゆうり','みはな','みもえ','くるみ']);
const MALE_NAMES=new Set(['もくじょ','てつ','りゅうと','ゆうた','ゆうご','だいすけ','ラスロ','たけし']);
function artForName(name){return FEMALE_NAMES.has(name)?CHARACTER_ART.female:CHARACTER_ART.male}
function makeArt(name,hero=false){
  const wrap=document.createElement('div');
  wrap.className=hero?'hero-character':'character-art';
  const img=document.createElement('img');
  const a=artForName(name);
  img.src=a.url; img.alt=name+'の立ち絵'; img.loading='lazy'; img.decoding='async';
  img.onerror=()=>{wrap.classList.add('art-fallback');img.remove();wrap.insertAdjacentHTML('beforeend','<span style="font-size:34px">'+(FEMALE_NAMES.has(name)?'👧':'👦')+'</span>')};
  wrap.appendChild(img);
  if(!hero){const b=document.createElement('span');b.className='art-badge';b.textContent=FEMALE_NAMES.has(name)?'♀':'♂';wrap.appendChild(b)}
  return wrap;
}
function decorateCharacterCards(){
  const list=document.getElementById('peopleList');
  if(list){
    [...list.querySelectorAll('.person')].forEach(el=>{
      const name=el.querySelector('.name')?.textContent.trim()||'';
      el.querySelector('.character-art')?.remove();
      el.prepend(makeArt(name,false));
      el.setAttribute('data-character',name);
    });
  }
  const hero=document.querySelector('.hero');
  if(hero){
    hero.querySelector('.hero-character')?.remove();
    hero.prepend(makeArt('りんか',true));
  }
}
/* Character art is intentionally disabled: the game uses clean face/emoji icons. */


/* ===== FINAL UI BEHAVIOR ===== */
function faceForKey(k){
  // 顔文字ではなく、😁😄😊😎などの表情系顔絵文字を人物ごとに割り当てる。
  // 名前キーから決めるので、画面を更新しても各キャラの表情は変わらない。
  const faces=['😁','😄','😊','😎','😏','🙂','🤗','😆','😉','🥹','😜','🤓','😌','😋','🙃'];
  const key=String(k||'unknown');
  let hash=0;
  for(let i=0;i<key.length;i++) hash=(hash*31+key.charCodeAt(i))>>>0;
  return faces[hash%faces.length];
}
function faceTagFor(p){
  if(p.state==='恋人')return '恋人';
  if(p.state==='セフレ')return 'セフレ';
  if(p.type==='ライバル')return 'ライバル';
  if(p.type==='友達'||p.type==='明るい友達'||p.type==='アホな友達'||p.type==='イケメン')return '友達';
  return '恋愛候補';
}
function decorateFaceCards(){
  const list=document.getElementById('peopleList');
  if(!list)return;
  [...list.querySelectorAll('.person')].forEach(el=>{
    el.querySelectorAll('.character-art,.face-avatar').forEach(x=>x.remove());
    const name=(el.querySelector('.name')?.textContent||'').replace(/♥.*$/,'').trim();
    const k=Object.keys(g.people).find(key=>g.people[key].name===name);
    const row=document.createElement('div'); row.className='face-avatar';
    row.innerHTML=`<span class="face-circle">${faceForKey(k)}</span><span><b class="person-name-clean">${name}</b><span class="face-tag">${k?faceTagFor(g.people[k]):''}</span></span>`;
    const old=el.querySelector('.name'); if(old) old.replaceWith(row);
    el.setAttribute('data-character',name);
  });
}
function openPanel(id,btn){
  const actionCard=document.getElementById('actionCard');
  const panelCard=document.getElementById('statusCard');
  const logCard=document.querySelector('.log-card');
  const tabs={status:'status',people:'people',calendar:'calendar',world:'world',history:'history'};

  // Each dashboard tile controls its own actual panel. The action panel is independent
  // so the time-advancing buttons are always visible when "今日の行動" is selected.
  if(id==='action'){
    if(actionCard) actionCard.style.display='block';
    if(panelCard) panelCard.style.display='none';
    if(logCard) logCard.style.display='block';
    // Bring the action picker and log into view together instead of leaving them below the menu.
    requestAnimationFrame(()=>document.querySelector('.main-stage')?.scrollIntoView({behavior:'smooth',block:'start'}));
  }else if(id==='status' || tabs[id]){
    if(actionCard) actionCard.style.display='none';
    if(panelCard) panelCard.style.display='block';
    if(logCard) logCard.style.display=(id==='status'?'block':'none');
    const target=tabs[id]||'status';
    ['status','people','calendar','world','history'].forEach(x=>{
      const e=$(x); if(e) e.style.display=x===target?'block':'none';
    });
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    const tab=[...document.querySelectorAll('.tab')].find(x=>x.getAttribute('onclick')?.includes("'"+target+"'"));
    tab?.classList.add('on');
  }else if(id==='exam'){
    if(actionCard) actionCard.style.display='none';
    if(panelCard) panelCard.style.display='none';
    if(logCard) logCard.style.display='none';
    openModal('🎓 受験状況', examText(), [{t:'閉じる',f:()=>{}}]);
  }
  document.querySelectorAll('.dash-tile').forEach(x=>x.classList.remove('active'));
  btn?.classList.add('active');
}
function openInbox(){
  const lines=(g.lineInbox||[]).slice(0,8);
  const txt=lines.length?lines.map(x=>`【${g.people[x.k]?.name||'誰か'}】 ${x.text}`).join('\n\n'):'まだ届いたLINEはない。';
  openModal('💬 LINE / SNS',txt,[{t:'閉じる',f:()=>{}}]);
}
function openRelationshipGraph(){
  const modal=document.getElementById('graphModal'); if(!modal)return;
  const canvas=document.getElementById('relationshipGraph');
  const keys=Object.keys(g.people);
  const nodes=[
    ['player',50,50,'げんた','👦🏻','center'],
    ['rinka',50,17,'りんか',faceForKey('rinka'),'love'],
    ['mokujyo',20,35,'もくじょ',faceForKey('mokujyo'),'friend'],
    ['tetsu',80,35,'てつ',faceForKey('tetsu'),'rival'],
    ['rise',17,69,'りせ',faceForKey('rise'),'love'],
    ['yuuri',83,69,'ゆうり',faceForKey('yuuri'),'love'],
    ['mihana',30,87,'みはな',faceForKey('mihana'),'love'],
    ['mimoe',70,87,'みもえ',faceForKey('mimoe'),'love']
  ].filter(n=>n[0]==='player'||keys.includes(n[0]));
  canvas.innerHTML='';
  const center=nodes.find(n=>n[0]==='player');
  nodes.filter(n=>n[0]!=='player').forEach(n=>{
    const p=g.people[n[0]]; if(!p)return;
    const line=document.createElement('div'); line.className='graph-line '+(n[4]==='love'?'love':n[4]==='rival'?'rival':'');
    const x1=center[1],y1=center[2],x2=n[1],y2=n[2]; const dx=x2-x1,dy=y2-y1; const len=Math.sqrt(dx*dx+dy*dy); const angle=Math.atan2(dy,dx)*180/Math.PI;
    line.style.left=x1+'%';line.style.top=y1+'%';line.style.width=len+'%';line.style.transform=`rotate(${angle}deg)`;canvas.appendChild(line);
  });
  nodes.forEach(n=>{
    const el=document.createElement('div');el.className='graph-node '+(n[4]==='love'?'love ':n[4]==='rival'?'rival ':'')+(n[5]==='center'?'graph-center':'');el.style.left=n[1]+'%';el.style.top=n[2]+'%';
    const p=g.people[n[0]]; const sub=n[0]==='player'?'浪人生・早稲田志望':relationLabel(p);
    el.innerHTML=`<div class="graph-face">${n[4]}</div><b>${n[3]}</b><small>${sub}</small>`;canvas.appendChild(el);
  });
  const rb=document.getElementById('graphNpcRomances');
  rb.innerHTML=(g.npcRomances||[]).length?g.npcRomances.map(r=>`<div class="graph-rel">${g.people[r.a]?.name||r.a} × ${g.people[r.b]?.name||r.b} — <b>${r.stage}</b></div>`).join(''):'<div class="empty-rel">まだ大きなNPC恋愛イベントはない。</div>';
  modal.classList.add('show');
}
function closeRelationshipGraph(){document.getElementById('graphModal')?.classList.remove('show')}

/* Keep the existing game engine, but make the final screen compact and face-icon based. */
const __finalRender=render;
render=function(){
  __finalRender();
  decorateFaceCards();
  const eb=document.getElementById('energyBadge');if(eb)eb.textContent=`行動力 ${Math.round(g.energy)}`;
  const ur=document.getElementById('dashUnread');if(ur)ur.textContent=(g.lineInbox||[]).length?`未読 ${Math.min(9,g.lineInbox.length)}`:'';
};

/* ===== EXTRA CONTENT PACK: backstage NPC life + clue-gated hidden events ===== */
function backstageNpcEventTick(){
  if(!g || !g.people || !g.npc) return;
  if(!g.flags) g.flags={};
  if(g._backstageLastDay===g.day) return;
  g._backstageLastDay=g.day;
  // Low-frequency autonomous scenes: these happen even when the player does not intervene.
  if(g.day>8 && Math.random()<0.16){
    const keys=Object.keys(g.people).filter(k=>g.people[k]);
    if(keys.length<2)return;
    let a=keys[Math.floor(Math.random()*keys.length)], b=keys[Math.floor(Math.random()*keys.length)];
    if(a===b)b=keys[(keys.indexOf(a)+1)%keys.length];
    const pa=g.people[a], pb=g.people[b];
    const scenes=[
      ()=>{pa.mood=clamp((pa.mood||50)+4);pb.mood=clamp((pb.mood||50)+2);addLog(`【裏側】${pa.name}と${pb.name}が帰り道に話し込んでいたらしい。`,'special');addClue(`${pa.name}と${pb.name}は最近、話す機会が増えている。`,1);},
      ()=>{pa.mood=clamp((pa.mood||50)-5);addLog(`【裏側】${pa.name}は少し落ち込んでいたが、理由はまだ分からない。`,'');addClue(`${pa.name}が何かを気にしている様子。`,1);},
      ()=>{if(g.npc[a]){g.npc[a].stress=clamp(g.npc[a].stress+5);g.npc[a].study=clamp(g.npc[a].study+1.5)}addLog(`【裏側】${pa.name}が一人で勉強を進めていた。`,'good');addClue(`${pa.name}は見えないところで努力している。`,1);},
      ()=>{if(g.npc[b])g.npc[b].stress=clamp(g.npc[b].stress-5);pb.mood=clamp((pb.mood||50)+3);addLog(`【裏側】${pb.name}は誰かに相談して少し気が楽になったようだ。`,'good');}
    ];
    scenes[Math.floor(Math.random()*scenes.length)]();
  }
}
const __autonomousBeforeBackstage=autonomousWorld;
autonomousWorld=function(){__autonomousBeforeBackstage();backstageNpcEventTick();};

const __deepEventBeforeHidden=deepEvent;
deepEvent=function(){
  if(!g.flags)g.flags={};
  // Clues unlock special scenes; each can happen only once per run.
  const clues=g.clues||[];
  if(g.day>80 && clues.length>=3 && !g.flags.hiddenStudyCircle && Math.random()<0.24){
    g.flags.hiddenStudyCircle=true;
    deepDecision('隠しイベント：勉強会の誘い','友人たちが小さな勉強会を続けていたらしい。今から参加すれば、普段は得られない情報を得られるかもしれない。',[
      {t:'参加する',f:()=>{g.world=clamp(g.world+3);g.jpn=clamp(g.jpn+2);g.route.social+=2;addClue('勉強会で得たつながりが、入試直前に再び現れる。',3);g.flags.studyCircleJoined=true;addLog('勉強会に参加し、友人と勉強法を共有した。','special')}},
      {t:'今回は参加しない',f:()=>{g.eng=clamp(g.eng+2);g.route.study+=1;addLog('勉強会には行かず、自分の課題を進めた。')}}
    ]);return true;
  }
  if(g.day>170 && g.flags.studyCircleJoined && !g.flags.hiddenRecommendation && Math.random()<0.28){
    g.flags.hiddenRecommendation=true;
    deepDecision('隠しイベント：直前期の情報','以前の勉強会で知り合った人から、直前期の演習資料が届いた。',[
      {t:'みんなで共有する',f:()=>{g.world=clamp(g.world+4);g.route.social+=1;addLog('演習資料を共有し、世界史の理解が深まった。','good');addClue('困った時に頼れる人がいる。',2)}},
      {t:'一人で使い込む',f:()=>{g.eng=clamp(g.eng+2);g.writing=clamp(g.writing+3);g.route.study+=2;addLog('資料を集中して解き、答案力が伸びた。','good')}}
    ]);return true;
  }
  if(g.day>230 && clues.length>=6 && !g.flags.hiddenTruth && Math.random()<0.18){
    g.flags.hiddenTruth=true;
    deepDecision('隠しイベント：噂の真相','いくつもの噂をつなぎ合わせると、友人の一人がずっと無理をしていたことが分かった。',[
      {t:'本人に声をかける',f:()=>{g.mental=clamp(g.mental+5);g.route.social+=2;addLog('友人に声をかけた。人間関係が少し深まった。','special');addClue('最後に支えてくれるのは、積み重ねた関係かもしれない。',3)}},
      {t:'そっと見守る',f:()=>{g.route.recovery+=2;g.mental=clamp(g.mental+2);addLog('無理に踏み込まず、見守ることにした。')}}
    ]);return true;
  }
  return __deepEventBeforeHidden();
};

// Extra endings require choices and clues, not just a high score.
const __finishBeforeSecretEnding=finish;
finish=function(){
  const r=g.route||{}, f=g.flags||{}, avg=(g.eng+g.jpn+g.world+g.writing)/4, pass=avg>=73&&g.mental>=35;
  let secret=null;
  if(pass && f.studyCircleJoined && f.hiddenRecommendation && (r.social||0)>=4) secret={title:'早稲田合格 — 仲間と掴んだ合格',desc:'見えないところで続いていた人間関係が、最後の一押しになった。'};
  else if(pass && f.hiddenTruth && (r.recovery||0)>=2) secret={title:'早稲田合格 — 静かな完成',desc:'周囲を見失わず、自分のペースも守り抜いた一年。'};
  else if(!pass && f.hiddenTruth && (r.social||0)>=5) secret={title:'支え合いの一年',desc:'結果だけでは測れない関係を築き、次へ進む土台を作った。'};
  if(!secret){__finishBeforeSecretEnding();return;}
  openModal('365日目 — '+secret.title,`${secret.desc}\n\n総合力 ${avg.toFixed(1)} / 勉強 ${Math.floor(g.totalStudy)}h / メンタル ${Math.round(g.mental)}\n隠しイベントを通じて特別な結末に到達した。`,[{t:'もう一度プレイ',f:()=>resetGame()}]);
};

render();
</script>
