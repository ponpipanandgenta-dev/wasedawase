<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浪人シミュレーター — WASEDA RUN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button{font:inherit;cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:12px}
header{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px}
h1{font-size:18px;margin:0}.sub{color:#8b949e;font-size:10px}.top{display:flex;gap:5px}
.btn{background:#21262d;color:#fff;border:1px solid #30363d;border-radius:7px;padding:6px 8px;font-size:11px}.btn:hover{background:#30363d}
.hero{background:linear-gradient(135deg,#172033,#111827);border:1px solid #26344b;border-radius:12px;padding:10px 12px;margin-bottom:9px}
.hero h2{margin:0 0 2px;font-size:21px}.hero p{margin:0;color:#9da9ba;font-size:11px}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:9px}.card{background:#161b22;border:1px solid #30363d;border-radius:11px;padding:10px}
.card h3{margin:0 0 8px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.stat{background:#0d1117;border:1px solid #21262d;border-radius:7px;padding:6px}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:#8b949e}
.bar{height:4px;background:#21262d;border-radius:4px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#58a6ff}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.action.skip{border-color:#8b949e;background:#161b22}.action.skip:hover{border-color:#58a6ff;transform:translateY(-1px)}
.action{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:7px;padding:8px 5px;text-align:left;min-height:48px}.action:hover{border-color:#58a6ff;transform:translateY(-1px)}.action strong{display:block;font-size:11px;white-space:nowrap}.action small{color:#8b949e;font-size:8px}
.tabs{display:flex;gap:4px;margin-bottom:7px;overflow:auto}.tab{padding:6px 9px;border-radius:7px;background:#21262d;color:#aaa;white-space:nowrap;font-size:11px}.tab.on{background:#1f6feb;color:white}
.log{height:220px;overflow:auto;display:flex;flex-direction:column;gap:5px}.event{padding:7px;border-radius:7px;background:#0d1117;border-left:3px solid #30363d;font-size:11px}.event.good{border-left-color:#3fb950}.event.bad{border-left-color:#f85149}.event.special{border-left-color:#a371f7}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.person{padding:8px;background:#0d1117;border-radius:7px;border:1px solid #21262d}.person .name{font-weight:700;font-size:11px}.heart{color:#ff6b9a}.muted{color:#8b949e;font-size:9px}.relrow{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.relbtn{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:4px 6px;font-size:9px}.relbtn:disabled{opacity:.35}.meter{display:grid;grid-template-columns:42px 1fr 24px;gap:4px;align-items:center;font-size:8px;color:#8b949e;margin-top:3px}.meter .bar{margin:0;height:3px}.relation{font-size:9px;color:#79c0ff;margin-top:3px}.relmodal{max-height:78vh;overflow:auto}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:12px;z-index:5}.modal.show{display:flex}.modalbox{max-width:560px;width:100%;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px}.choices{display:grid;gap:6px;margin-top:10px}.choice{padding:10px;background:#21262d;color:white;border-radius:7px;text-align:left;font-size:12px}.choice:hover{background:#30363d}
.progress{font-size:10px;color:#8b949e;margin-top:5px}.calendar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.monthCard{background:#0d1117;border:1px solid #21262d;border-radius:7px;padding:7px;font-size:9px;min-height:52px}.monthCard b{display:block;font-size:11px;color:#e6edf3}.monthCard span{display:block;color:#8b949e;margin-top:2px}.monthCard small{display:block;color:#ff7b72;margin-top:3px}.monthCard.active{outline:2px solid #58a6ff}
@media(max-width:760px){
  .app{padding:7px}
  header{margin-bottom:6px}
  h1{font-size:15px}.sub{font-size:8px}
  .top{gap:3px}.btn{padding:5px 6px;font-size:9px}
  .hero{padding:8px 10px;margin-bottom:6px;border-radius:9px}
  .hero h2{font-size:18px}.hero p{font-size:9px}
  .grid{grid-template-columns:1fr;gap:6px}
  .card{padding:7px;border-radius:9px}
  .card h3{font-size:11px;margin-bottom:5px}
  .stats{grid-template-columns:repeat(4,1fr);gap:3px}
  .stat{padding:5px;border-radius:5px}.stat b{font-size:13px}.stat span{font-size:7px}
  .actions{grid-template-columns:repeat(4,1fr);gap:3px}
  .action{padding:6px 3px;min-height:43px;border-radius:6px}
  .action strong{font-size:9px}.action small{font-size:6px}
  .tabs{margin-bottom:5px}.tab{padding:5px 7px;font-size:9px}
  .log{height:170px;gap:3px}.event{padding:5px;font-size:9px}
  .people{grid-template-columns:repeat(3,1fr);gap:3px}.person{padding:5px}.person .name{font-size:9px}.muted{font-size:7px}
  aside{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
  aside .card,aside .card[style]{margin-top:0!important}
  aside .card h3{font-size:9px}
  aside .card>div[style]{font-size:18px!important}
  .modalbox{padding:11px}.choice{padding:8px;font-size:10px}
}

/* V3 relationship / world systems */
.pill{display:inline-block;padding:2px 5px;border-radius:99px;background:#21262d;color:#9da9ba;font-size:8px;margin:2px 2px 0 0}.pink{color:#ff7aa2}.gold{color:#e3b341}.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.loc{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:9px;text-align:left;color:#fff}.loc small{display:block;color:#8b949e;font-size:8px;margin-top:2px}.timeline{display:flex;gap:5px;overflow:auto}.month{min-width:80px;background:#0d1117;border:1px solid #21262d;border-radius:7px;padding:7px;font-size:9px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.summary div{background:#0d1117;border-radius:7px;padding:7px;font-size:9px}.chat{background:#0d1117;border-radius:8px;padding:8px;max-height:250px;overflow:auto}.bubble{padding:7px 9px;border-radius:9px;margin:4px 0;max-width:88%;font-size:10px}.npc{background:#21262d}.me{background:#1f6feb;margin-left:auto}.eventcard{padding:8px;background:#0d1117;border-radius:7px;margin:5px 0;font-size:10px}.npcrom{padding:7px;background:#0d1117;border-radius:7px;margin-top:5px;font-size:9px}.rankrow{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #21262d;font-size:9px}.rankme{color:#58a6ff;font-weight:700}.unread{display:inline-block;background:#f85149;color:#fff;border-radius:99px;padding:1px 5px;font-size:8px;margin-left:3px}.eventcard b{font-size:11px}.eventcard small{color:#8b949e}.flag{color:#a371f7}
@media(max-width:760px){.mapgrid{grid-template-columns:repeat(3,1fr)}.loc{padding:6px;font-size:9px}.loc small{font-size:6px}.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>浪人シミュレーター <span class="sub">WASEDA RUN</span></h1><div class="sub">2026年度 — 早稲田合格を目指せ ・ 登場人物は全員18歳以上</div></div>
<div class="top"><button class="btn" onclick="saveGame()">保存</button><button class="btn" onclick="loadGame()">読込</button><button class="btn" onclick="resetGame()">最初から</button></div></header>

<section class="hero"><h2 id="date">4月1日（水）</h2><p id="phase">浪人生活、開始。</p><div class="progress" id="days"></div></section>

<div class="grid">
<main>
<div class="card">
<div class="tabs"><button class="tab on" onclick="showTab('status',this)">ステータス</button><button class="tab" onclick="showTab('people',this)">人間関係</button><button class="tab" onclick="showTab('calendar',this)">年間予定</button><button class="tab" onclick="showTab('world',this)">世界</button><button class="tab" onclick="showTab('history',this)">1年の記録</button></div>
<div id="status">
<div class="stats" id="stats"></div>
<h3 style="margin-top:16px">今日の行動</h3><div class="actions" id="actions"></div>
</div>
<div id="people" style="display:none"><div class="muted" style="margin-bottom:7px">行動すると好感・信頼・親密度が変化。関係が進むと固有イベントが解禁。</div><div class="people" id="peopleList"></div></div>
<div id="calendar" style="display:none"><div class="timeline" id="monthEvents"></div><div style="height:7px"></div><div class="calendar" id="calendarGrid"></div></div>
<div id="world" style="display:none"><h3>今日どこへ行く？</h3><div class="mapgrid" id="map"></div><div class="eventcard"><b>噂・人間関係</b><div id="rumors"></div></div><div class="eventcard"><b>約束</b><div id="promises"></div></div></div>
<div id="history" style="display:none"><div class="summary" id="summary"></div><div class="eventcard"><b>この1年の出来事</b><div id="milestones"></div></div></div>
</div>
<div class="card" style="margin-top:14px"><h3>生活ログ</h3><div class="log" id="log"></div></div>
</main>

<aside>
<div class="card"><h3>受験状況</h3><div id="exam"></div></div>
<div class="card" style="margin-top:14px"><h3>現在の所持金</h3><div style="font-size:26px;font-weight:700" id="money"></div><div class="muted">バイト・出費・イベントで変動</div></div>
<div class="card" style="margin-top:14px"><h3>今日の目標</h3><div id="goal"></div></div>
<div class="card" style="margin-top:14px"><h3>予備校ランキング</h3><div id="ranking"></div></div>
</aside>
</div>
</div>

<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="choices" id="choices"></div></div></div>

<script>
const initial={
day:0, money:80000, energy:80, mental:75, health:80,
eng:48,jpn:42,world:50,writing:40,
study:0, streak:0, totalStudy:0, saved:false, unreadLines:0, lineInbox:[], npcScores:{},
people:{
 rinka:{name:"りんか",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 mokujyo:{name:"もくじょ",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 tetsu:{name:"てつ",type:"ライバル",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},

 ryuto:{name:"りゅうと",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 yuta:{name:"ゆうた",type:"明るい友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 yugo:{name:"ゆうご",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 daisuke:{name:"だいすけ",type:"友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 rasuro:{name:"ラスロ",type:"イケメン",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 takeshi:{name:"たけし",type:"アホな友達",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 rise:{name:"りせ",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 yuuri:{name:"ゆうり",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 mihana:{name:"みはな",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 mimoe:{name:"みもえ",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99},
 kurumi:{name:"くるみ",type:"恋愛候補",aff:0,trust:0,close:0,mood:50,state:"未交流",last:-99}
},
logs:[{t:"4月1日",x:"今日から浪人生活が始まった。第一志望は早稲田。",c:"special"}]
};
let g=JSON.parse(JSON.stringify(initial));
const dow=["水","木","金","土","日","月","火"];
const months=[30,31,30,31,31,30,31,30,31,30,31,31];

function $(id){return document.getElementById(id)}
function dateObj(){let d=new Date(2026,3,1);d.setDate(d.getDate()+g.day);return d}
function dateStr(){let d=dateObj();return `${d.getMonth()+1}月${d.getDate()}日（${dow[g.day%7]}）`}
function clamp(n,a=0,b=100){return Math.max(a,Math.min(b,n))}
const romanceCandidates=new Set(["rinka","rise","yuuri","mihana","mimoe","kurumi"]);
function isRomance(k){return romanceCandidates.has(k)}
function addLog(x,c=""){g.logs.unshift({t:dateStr(),x,c}); if(g.logs.length>80)g.logs.pop()}
function stat(label,val,desc){return `<div class="stat"><span>${label}</span><b>${Math.round(val)}</b><div class="bar"><div class="fill" style="width:${clamp(val)}%"></div></div><span>${desc}</span></div>`}

function render(){
$("date").textContent=dateStr();
let p=g.day<30?"基礎固め":g.day<120?"夏までの伸長期":g.day<210?"秋の実戦期":g.day<285?"冬の完成期":"入試本番";
$("phase").textContent=p;
$("days").textContent=`本番まで ${365-g.day} 日 / 勉強 ${Math.floor(g.totalStudy)} 時間`;
$("stats").innerHTML=
stat("英語",g.eng,"長文・文法・語彙")+stat("国語",g.jpn,"現代文・古文・漢文")+
stat("世界史",g.world,"通史・論述")+stat("記述力",g.writing,"答案作成")+
stat("体力",g.health,"生活習慣")+stat("メンタル",g.mental,"継続力")+
stat("集中力",g.energy,"今日の行動力")+stat("勉強習慣",clamp(g.streak*4),"継続日数");
$("money").textContent=`¥${g.money.toLocaleString()}`;
$("actions").innerHTML=`
<button class="action" onclick="study('eng')"><strong>📘 英語を勉強</strong><small>+英語 / 疲労</small></button>
<button class="action" onclick="study('jpn')"><strong>📕 国語を勉強</strong><small>+国語 / 疲労</small></button>
<button class="action" onclick="study('world')"><strong>📗 世界史を勉強</strong><small>+世界史 / 疲労</small></button>
<button class="action" onclick="study('all')"><strong>📚 3科目演習</strong><small>総合力 / 大疲労</small></button>
<button class="action" onclick="social()"><strong>💬 人と会う</strong><small>好感度 / メンタル</small></button>
<button class="action" onclick="rest()"><strong>🛌 休む</strong><small>体力 / メンタル</small></button>
<button class="action" onclick="partTime()"><strong>💴 バイト</strong><small>お金 / 時間</small></button>
<button class="action" onclick="simulateDay()"><strong>⏩ 1日進める</strong><small>何もしない</small></button>
<button class="action skip" onclick="skipDays(3)"><strong>⏭️ 3日進める</strong><small>高速シミュレーション</small></button>
<button class="action skip" onclick="skipDays(7)"><strong>⏭️ 1週間進める</strong><small>重要イベントで停止</small></button>
<button class="action skip" onclick="skipDays(30)"><strong>⏭️ 1ヶ月進める</strong><small>月間イベントを確認</small></button>
<button class="action skip" onclick="skipToMajor()"><strong>🚀 次の大型イベント</strong><small>模試・入試などまで</small></button>`;
$("exam").innerHTML=examText();
$("goal").innerHTML=goalText();$("ranking").innerHTML=rankingText();
$("peopleList").innerHTML=Object.entries(g.people).map(([k,p])=>{
 let cooldown=Math.max(0,3-(g.day-p.last));
 return `<div class="person"><div class="name">${p.name} <span class="heart">♥</span> ${p.aff}</div><div class="relation">${relationLabel(p)}</div>
 <div class="meter"><span>好感</span><div class="bar"><div class="fill" style="width:${p.aff}%"></div></div><b>${p.aff}</b></div>
 <div class="meter"><span>信頼</span><div class="bar"><div class="fill" style="width:${p.trust}%"></div></div><b>${p.trust}</b></div>
 <div class="meter"><span>親密</span><div class="bar"><div class="fill" style="width:${p.close}%"></div></div><b>${p.close}</b></div>
 <div class="muted">機嫌 ${p.mood} / ${p.type} ${p.handhold?'<span class="pill pink">手をつないだ</span>':''} ${p.hug?'<span class="pill pink">ハグ済み</span>':''}</div>
 <div class="relrow"><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','line')">💬 LINE ${g.people[k].unread?'<span class="unread">未読</span>':''}</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','study')">📚 勉強</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','lunch')">🍱 昼飯</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','return')">🚶 帰り道</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','date')">🎡 遊ぶ</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','talk')">🗣 相談</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','gift')">🎁 プレゼント</button><button class="relbtn" onclick="apologize('${k}')">🙏 謝る</button><button class="relbtn" onclick="distance('${k}')">↔ 距離を置く</button></div>
 </div>`
}).join("");
$("calendarGrid").innerHTML=monthNames.map((m,mi)=>{ let start=mi===0?0:months.slice(0,mi).reduce((a,b)=>a+b,0); let end=start+months[mi]-1; let events=[]; if(mi===9) events.push("共テ直前"); if(mi===10) events.push("共通テスト・出願"); if(mi===11) events.push("早稲田入試"); let active=g.day>=start&&g.day<=end; return `<div class="monthCard ${active?"active":""}"><b>${m}</b><span>${start+1}〜${end+1}日</span>${events.map(e=>`<small>${e}</small>`).join("")}</div>`; }).join("");
$("log").innerHTML=g.logs.map(l=>`<div class="event ${l.c}"><span class="muted">${l.t}</span><br>${l.x}</div>`).join("");
}
function examText(){
let avg=(g.eng+g.jpn+g.world+g.writing)/4;
let grade=avg>=78?"A":avg>=68?"B":avg>=58?"C":avg>=48?"D":"E";
return `<div style="font-size:42px;font-weight:800">${grade}判定</div><p>総合力 ${avg.toFixed(1)}</p>
<div class="muted">早稲田 商学部 / 文化構想</div><div class="progress">本番想定：${g.day<250?"まだ伸ばせる":"実戦力が重要な時期"}</div>`;
}
function goalText(){
let d=dateObj();let goals=g.day<90?["英単語を固める","世界史通史を一周","古文単語を継続"]:g.day<210?["早稲田レベル演習","過去問研究","弱点補強"]:["過去問演習","答案の精度","睡眠と体調管理"];
return `<b>${goals[g.day%goals.length]}</b><p class="muted">行動によってステータスと人間関係が変化します。</p>`;
}
function showTab(id,b){["status","people","calendar","world","history"].forEach(x=>$(x).style.display=x===id?"block":"none");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on")}

function study(type){
if(g.energy<18){addLog("今日はもう集中力が残っていない。休むべきだ。","bad");render();return}
let gain= type==="all"?2.2:4.2;
let cost=type==="all"?28:17;
if(type==="all"){g.eng+=gain;g.jpn+=gain;g.world+=gain;g.writing+=1.2}
else g[type]+=gain;
g[type==="all"?"eng":type]=type==="all"?g.eng:clamp(g[type]);
g.energy-=cost;g.health-=type==="all"?4:2;g.totalStudy+=type==="all"?5:2.5;g.streak++;
addLog(type==="all"?"3科目の実戦演習をやり切った。":`${{eng:"英語",jpn:"国語",world:"世界史"}[type]}を集中して勉強した。`,"good");
randomEvent();advance();
}
function rest(){g.energy=95;g.health=clamp(g.health+9);g.mental=clamp(g.mental+8);g.streak=0;addLog("今日は休養日。明日に備えて回復した。");advance()}
function social(){
 let keys=Object.keys(g.people);let k=keys[Math.floor(Math.random()*keys.length)];relAction(k,'meet',true)
}
function relationLabel(p){
 if(p.state==='恋人' && p.close>=80) return '💗 深い恋人関係';
 if(p.aff>=80 && p.trust>=70) return p.state==='恋人'?'💗 恋人':'✨ 特別な存在';
 if(p.aff>=65 && p.trust>=55) return '💛 親しい';
 if(p.aff>=50 && p.trust>=45) return '🙂 仲がいい';
 if(p.trust>=65) return '🤝 信頼できる友人';
 return p.state;
}
function relAction(k,action,fromSocial=false){
 let p=g.people[k];
 if(!fromSocial && g.day-p.last<3){addLog(`${p.name}とは少し間を空けた方がよさそうだ。`,'bad');render();return}
 if(g.energy<8){addLog('今日はもう人と関わる余力がない。','bad');render();return}
 let effects={line:[3,2,4,1],study:[4,5,6,0],meet:[7,4,10,5],talk:[4,9,7,2]}[action];

   if(r.score<20&&r.stage!=='気になる'){
     r.stage='距離ができた';
     addRumor(`${g.people[r.a].name}と${g.people[r.b].name}、最近は少し距離があるみたい。`,'人間関係');
   }
 });
}
function renderNpcRomances(){
 ensureV3();
 const box=document.getElementById('history');
 if(!box)return;
 let card=document.getElementById('npcRomanceBox');
 if(!card){
   card=document.createElement('div');card.id='npcRomanceBox';card.className='eventcard';
   card.innerHTML='<b>NPCの人間関係</b><div id="npcRomanceList"></div>';
   box.appendChild(card);
 }
 document.getElementById('npcRomanceList').innerHTML=g.npcRomances.length?g.npcRomances.map(r=>`<div class="npcrom">${g.people[r.a].name} × ${g.people[r.b].name} — <b>${r.stage}</b></div>`).join(''):'<span class="muted">まだ大きな変化はない。</span>';
}
function autonomousWorld(){
 const ps=Object.entries(g.people);ps.forEach(([k,p])=>{if(Math.random()<.35){p.mood=clamp(p.mood+(Math.random()<.5?-3:3));p.last=Math.max(p.last,g.day-10)}});
 if(Math.random()<.10){const keys=Object.keys(g.people);const a=keys[Math.floor(Math.random()*keys.length)],b=keys[Math.floor(Math.random()*keys.length)];if(a!==b){g.people[a].mood=clamp(g.people[a].mood-3);addRumor(`${g.people[a].name}と${g.people[b].name}が何か話していた。`,'人間関係');}}
 if(Math.random()<.16&&g.day>20){
   g.npcScores.tetsu=(g.npcScores.tetsu||55)+1+Math.random()*2.5;
   g.people.tetsu.aff=clamp(g.people.tetsu.aff+2);
   if(Math.random()<.45) addLog('てつが勝手に勉強量を伸ばしている。ライバルとの差が動いた。','special');
 }
 npcRomanceTick();
}
function monthlyEvent(){if(g.day%30!==0)return;const mi=Math.floor(g.day/30);if(mi<monthly.length){addLog(`月間イベント：${monthly[mi]}`,'special');if(mi===3){g.mental=clamp(g.mental+5);addLog('夏祭りの誘いが増えた。','special')}if(mi===6){let ks=[...romanceCandidates];let k=ks[Math.floor(Math.random()*ks.length)];g.people[k].mood=clamp(g.people[k].mood+8);g.people.mokujyo.aff=clamp(g.people.mokujyo.aff+4)}}}
function renderMonthEvents(){$('monthEvents').innerHTML=monthly.map((x,i)=>`<div class="month"><b>${monthNames[i]}</b><br>${x}</div>`).join('')}
function npcBaseScore(k){
 ensureV3();
 if(g.npcScores[k]==null){const seed=[...k].reduce((a,c)=>a+c.charCodeAt(0),0);g.npcScores[k]=42+(seed%31);}
 return g.npcScores[k];
}
function rankingText(){
 const names=Object.entries(g.people).map(([k,p])=>({k,name:p.name,score:Math.round(npcBaseScore(k)+p.aff*.18+p.trust*.08)}));
 const meScore=Math.round((g.eng+g.jpn+g.world+g.writing)/4+g.totalStudy*.035);
 names.push({k:'me',name:'あなた',score:meScore});
 names.sort((a,b)=>b.score-a.score);
 const rank=names.findIndex(x=>x.k==='me')+1;
 return `<div class="muted" style="margin-bottom:4px">総合力＋勉強量から算出</div><div class="rankrow rankme"><span>${rank}位　あなた</span><b>${meScore}</b></div>`+
 names.filter(x=>x.k!=='me').slice(0,5).map((x,i)=>`<div class="rankrow"><span>${names.findIndex(y=>y.k===x.k)+1}位　${x.name}</span><b>${x.score}</b></div>`).join('')+`<div class="muted" style="margin-top:5px">クラス内 ${rank}/${names.length}位</div>`;
}
function maybeIncomingLine(){
 const keys=Object.keys(g.people).filter(k=>g.people[k].state!=='未交流'||g.people[k].aff>=15);
 if(!keys.length||Math.random()>=.12)return;
 const k=keys[Math.floor(Math.random()*keys.length)],p=g.people[k];
 p.unread=true;g.unreadLines=(g.unreadLines||0)+1;
 const msgs=['今ちょっと話せる？','今日どうだった？','また一緒に勉強しよ','最近忙しそうだね','今度どこか行かない？'];
 const msg=msgs[Math.floor(Math.random()*msgs.length)];
 g.lineInbox=g.lineInbox||[];g.lineInbox.unshift({day:g.day,k,text:msg});if(g.lineInbox.length>20)g.lineInbox.pop();
 addLog(`${p.name}からLINEが来た。「${msg}」`,'special');
}
function choiceEvent(){
 if(Math.random()>=.10)return;
 const events=[
  {title:'自習室での誘い',text:'勉強中、仲のいい相手から「今日は一緒に帰らない？」と誘われた。',opts:[
   ['一緒に帰る',()=>{g.energy-=8;g.mental=clamp(g.mental+4);addLog('一緒に帰って気分転換した。','good')}],
   ['自習を続ける',()=>{g.totalStudy+=1.5;g.eng+=.7;g.mental=clamp(g.mental-2);addLog('誘いを断って自習を続けた。','good')}]]},
  {title:'模試前の誘惑',text:'前日に友達から遊びに誘われた。',opts:[
   ['遊ぶ',()=>{g.mental=clamp(g.mental+7);g.streak=Math.max(0,g.streak-1);addLog('模試前に遊んでリフレッシュした。')}],
   ['断る',()=>{g.eng+=1;g.jpn+=.5;g.streak++;addLog('模試を優先して断った。','good')}]]},
  {title:'SNSで見た結果',text:'友達が模試の好成績をSNSに載せていた。',opts:[
   ['悔しい。勉強する',()=>{g.mental=clamp(g.mental+2);g.world+=1.2;g.streak++;addLog('刺激を受けて世界史を追加で勉強した。','good')}],
   ['気にしない',()=>{g.mental=clamp(g.mental+1);addLog('人と比べず自分のペースを守った。')}]]}
 ];
 const e=events[Math.floor(Math.random()*events.length)];
 openModal(e.title,e.text,e.opts.map(([t,f])=>({t,f:()=>{f();advance()}})));return true;
}
function renderHistory(){let avg=(g.eng+g.jpn+g.world+g.writing)/4;$('summary').innerHTML=`<div>総勉強時間<br><b>${Math.floor(g.totalStudy)}h</b></div><div>最高判定<br><b>${avg>=78?'A':avg>=68?'B':avg>=58?'C':avg>=48?'D':'E'}</b></div><div>手をつないだ回数<br><b>${g.history.handholds}</b></div><div>ハグ<br><b>${g.history.hugs}</b></div><div>デート・遊び<br><b>${g.history.dates}</b></div><div>約束を守った<br><b>${g.history.promisesKept}</b></div><div>約束を破った<br><b>${g.history.promisesBroken}</b></div><div>噂が生まれた<br><b>${g.history.rumors}</b></div><div>一線を超えた関係<br><b>${g.history.deepRelations||0}</b></div>`;$('milestones').innerHTML=g.logs.filter(x=>x.c==='special').slice(0,14).map(x=>`<div>・<span class="muted">${x.t}</span> ${x.x}</div>`).join('')}
// Override render to include V3 panels while retaining the original UI.
const oldRender=render;
render=function(){oldRender();ensureV3();renderWorld();renderMonthEvents();renderHistory();renderNpcRomances();Object.entries(g.people).forEach(([k,p])=>{p.state=relationStage(p)});};
const oldRelAction=relAction;relAction=function(k,a,fromSocial=false){if(fromSocial){return relActionV3(k,'meet')}return relActionV3(k,a)};
const oldAdvance=advance;
advance=function(){autonomousWorld();monthlyEvent();oldAdvance();maybeIncomingLine();checkPromises();};

/* ===== FAST FORWARD ===== */
function skipDays(n){
  ensureV3();
  if(g.day>=364){finish();return;}
  const start=g.day;
  let stopped=false, reason='';
  for(let i=0;i<n && g.day<364;i++){
    // Simulate one ordinary day without rendering after every step.
    autonomousWorld();
    g.energy=clamp(g.energy+15);
    g.health=clamp(g.health-1);
    g.mental=clamp(g.mental-1);
    if(Math.random()<0.24) randomEvent();
    g.day++;
    if(g.day%7===0){g.money-=3500;addLog('週の生活費として¥3,500使った。');}
    if(g.day%30===0){g.eng+=1;g.jpn+=1;g.world+=1;addLog('1か月の継続効果で基礎力が少し伸びた。','good');monthlyEvent();}
    // Promises and important relationship events interrupt the skip.
    const due=g.promises.find(pr=>!pr.done&&pr.day===g.day);
    if(due){stopped=true;reason='約束の日';break;}
    // Stop at major exam days.
    if([305,315,325,335].includes(g.day)){stopped=true;reason='大型イベント';break;}
  }
  const moved=g.day-start;
  addLog(`${moved}日間を高速シミュレーションした。${stopped?'重要イベントで停止。':''}`,'special');
  render();
  if(g.day>=364){finish();return;}
  const due=g.promises.find(pr=>!pr.done&&pr.day===g.day);
  if(due){checkPromises();return;}
  if(stopped){
    if([305,315,325,335].includes(g.day)){
      openModal('大型イベント', `${dateStr()}です。重要なイベントが発生します。`, [
        {t:'確認して進む',f:()=>{randomEvent();render();}},
        {t:'今日はここで止める',f:()=>{render();}}
      ]);
    }
  }
}
function skipToMajor(){
  const targets=[30,60,90,120,150,180,210,240,270,285,305,315,325,335,364];
  const next=targets.find(d=>d>g.day);
  if(!next){finish();return;}
  skipDays(Math.max(1,next-g.day));
}

render();
</script>
