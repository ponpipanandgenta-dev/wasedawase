<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浪人シミュレーター — WASEDA RUN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button{font:inherit;cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:12px}
header{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px}
h1{font-size:18px;margin:0}.sub{color:#8b949e;font-size:10px}.top{display:flex;gap:5px}
.btn{background:#21262d;color:#fff;border:1px solid #30363d;border-radius:7px;padding:6px 8px;font-size:11px}.btn:hover{background:#30363d}
.hero{background:linear-gradient(135deg,#172033,#111827);border:1px solid #26344b;border-radius:12px;padding:10px 12px;margin-bottom:9px}
.hero h2{margin:0 0 2px;font-size:21px}.hero p{margin:0;color:#9da9ba;font-size:11px}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:9px}.card{background:#161b22;border:1px solid #30363d;border-radius:11px;padding:10px}
.card h3{margin:0 0 8px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.stat{background:#0d1117;border:1px solid #21262d;border-radius:7px;padding:6px}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:#8b949e}
.bar{height:4px;background:#21262d;border-radius:4px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#58a6ff}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.action{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:7px;padding:8px 5px;text-align:left;min-height:48px}.action:hover{border-color:#58a6ff;transform:translateY(-1px)}.action strong{display:block;font-size:11px;white-space:nowrap}.action small{color:#8b949e;font-size:8px}
.tabs{display:flex;gap:4px;margin-bottom:7px;overflow:auto}.tab{padding:6px 9px;border-radius:7px;background:#21262d;color:#aaa;white-space:nowrap;font-size:11px}.tab.on{background:#1f6feb;color:white}
.log{height:220px;overflow:auto;display:flex;flex-direction:column;gap:5px}.event{padding:7px;border-radius:7px;background:#0d1117;border-left:3px solid #30363d;font-size:11px}.event.good{border-left-color:#3fb950}.event.bad{border-left-color:#f85149}.event.special{border-left-color:#a371f7}
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.person{padding:8px;background:#0d1117;border-radius:7px;border:1px solid #21262d}.person .name{font-weight:700;font-size:11px}.heart{color:#ff6b9a}.muted{color:#8b949e;font-size:9px}.relrow{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.relbtn{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:4px 6px;font-size:9px}.relbtn:disabled{opacity:.35}.meter{display:grid;grid-template-columns:42px 1fr 24px;gap:4px;align-items:center;font-size:8px;color:#8b949e;margin-top:3px}.meter .bar{margin:0;height:3px}.relation{font-size:9px;color:#79c0ff;margin-top:3px}.relmodal{max-height:78vh;overflow:auto}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:12px;z-index:5}.modal.show{display:flex}.modalbox{max-width:560px;width:100%;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px}.choices{display:grid;gap:6px;margin-top:10px}.choice{padding:10px;background:#21262d;color:white;border-radius:7px;text-align:left;font-size:12px}.choice:hover{background:#30363d}
.progress{font-size:10px;color:#8b949e;margin-top:5px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.day{min-height:38px;background:#0d1117;border-radius:5px;padding:4px;font-size:8px;color:#8b949e}.day.today{outline:2px solid #58a6ff;color:#fff}.day.exam{background:#351b1b;color:#ff7b72}
@media(max-width:760px){
  .app{padding:7px}
  header{margin-bottom:6px}
  h1{font-size:15px}.sub{font-size:8px}
  .top{gap:3px}.btn{padding:5px 6px;font-size:9px}
  .hero{padding:8px 10px;margin-bottom:6px;border-radius:9px}
  .hero h2{font-size:18px}.hero p{font-size:9px}
  .grid{grid-template-columns:1fr;gap:6px}
  .card{padding:7px;border-radius:9px}
  .card h3{font-size:11px;margin-bottom:5px}
  .stats{grid-template-columns:repeat(4,1fr);gap:3px}
  .stat{padding:5px;border-radius:5px}.stat b{font-size:13px}.stat span{font-size:7px}
  .actions{grid-template-columns:repeat(4,1fr);gap:3px}
  .action{padding:6px 3px;min-height:43px;border-radius:6px}
  .action strong{font-size:9px}.action small{font-size:6px}
  .tabs{margin-bottom:5px}.tab{padding:5px 7px;font-size:9px}
  .log{height:170px;gap:3px}.event{padding:5px;font-size:9px}
  .people{grid-template-columns:repeat(2,1fr);gap:3px}.person{padding:5px}.person .name{font-size:9px}.muted{font-size:7px}
  aside{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  aside .card,aside .card[style]{margin-top:0!important}
  aside .card h3{font-size:9px}
  aside .card>div[style]{font-size:18px!important}
  .modalbox{padding:11px}.choice{padding:8px;font-size:10px}
}

/* V3 relationship / world systems */
.pill{display:inline-block;padding:2px 5px;border-radius:99px;background:#21262d;color:#9da9ba;font-size:8px;margin:2px 2px 0 0}.pink{color:#ff7aa2}.gold{color:#e3b341}.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.loc{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:9px;text-align:left;color:#fff}.loc small{display:block;color:#8b949e;font-size:8px;margin-top:2px}.timeline{display:flex;gap:5px;overflow:auto}.month{min-width:80px;background:#0d1117;border:1px solid #21262d;border-radius:7px;padding:7px;font-size:9px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.summary div{background:#0d1117;border-radius:7px;padding:7px;font-size:9px}.chat{background:#0d1117;border-radius:8px;padding:8px;max-height:250px;overflow:auto}.bubble{padding:7px 9px;border-radius:9px;margin:4px 0;max-width:88%;font-size:10px}.npc{background:#21262d}.me{background:#1f6feb;margin-left:auto}.eventcard{padding:8px;background:#0d1117;border-radius:7px;margin:5px 0;font-size:10px}.eventcard b{font-size:11px}.eventcard small{color:#8b949e}.flag{color:#a371f7}
@media(max-width:760px){.mapgrid{grid-template-columns:repeat(3,1fr)}.loc{padding:6px;font-size:9px}.loc small{font-size:6px}.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>浪人シミュレーター <span class="sub">WASEDA RUN</span></h1><div class="sub">2026年度 — 早稲田合格を目指せ</div></div>
<div class="top"><button class="btn" onclick="saveGame()">保存</button><button class="btn" onclick="loadGame()">読込</button><button class="btn" onclick="resetGame()">最初から</button></div></header>

<section class="hero"><h2 id="date">4月1日（水）</h2><p id="phase">浪人生活、開始。</p><div class="progress" id="days"></div></section>

<div class="grid">
<main>
<div class="card">
<div class="tabs"><button class="tab on" onclick="showTab('status',this)">ステータス</button><button class="tab" onclick="showTab('people',this)">人間関係</button><button class="tab" onclick="showTab('calendar',this)">年間予定</button><button class="tab" onclick="showTab('world',this)">世界</button><button class="tab" onclick="showTab('history',this)">1年の記録</button></div>
<div id="status">
<div class="stats" id="stats"></div>
<h3 style="margin-top:16px">今日の行動</h3><div class="actions" id="actions"></div>
</div>
<div id="people" style="display:none"><div class="muted" style="margin-bottom:7px">行動すると好感・信頼・親密度が変化。関係が進むと固有イベントが解禁。</div><div class="people" id="peopleList"></div></div>
<div id="calendar" style="display:none"><div class="timeline" id="monthEvents"></div><div style="height:7px"></div><div class="calendar" id="calendarGrid"></div></div>
<div id="world" style="display:none"><h3>今日どこへ行く？</h3><div class="mapgrid" id="map"></div><div class="eventcard"><b>噂・人間関係</b><div id="rumors"></div></div><div class="eventcard"><b>約束</b><div id="promises"></div></div></div>
<div id="history" style="display:none"><div class="summary" id="summary"></div><div class="eventcard"><b>この1年の出来事</b><div id="milestones"></div></div></div>
</div>
<div class="card" style="margin-top:14px"><h3>生活ログ</h3><div class="log" id="log"></div></div>
</main>

<aside>
<div class="card"><h3>受験状況</h3><div id="exam"></div></div>
<div class="card" style="margin-top:14px"><h3>現在の所持金</h3><div style="font-size:26px;font-weight:700" id="money"></div><div class="muted">バイト・出費・イベントで変動</div></div>
<div class="card" style="margin-top:14px"><h3>今日の目標</h3><div id="goal"></div></div>
</aside>
</div>
</div>

<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="choices" id="choices"></div></div></div>

<script>
const initial={
day:0, money:80000, energy:80, mental:75, health:80,
eng:48,jpn:42,world:50,writing:40,
study:0, streak:0, totalStudy:0, saved:false,
people:{
 rinka:{name:"りんか",type:"恋人",aff:62,trust:55,close:58,mood:72,state:"恋人",last:-7},
 mokujyo:{name:"もくじょ",type:"友達",aff:60,trust:70,close:52,mood:68,state:"友達",last:-4},
 tetsu:{name:"てつ",type:"ライバル",aff:50,trust:50,close:35,mood:55,state:"ライバル",last:-3},
 keio:{name:"予備校の女子",type:"クラスメイト",aff:35,trust:35,close:28,mood:62,state:"クラスメイト",last:-12}
},
logs:[{t:"4月1日",x:"今日から浪人生活が始まった。第一志望は早稲田。",c:"special"}]
};
let g=JSON.parse(JSON.stringify(initial));
const dow=["水","木","金","土","日","月","火"];
const months=[30,31,30,31,31,30,31,30,31,30,31,31];

function $(id){return document.getElementById(id)}
function dateObj(){let d=new Date(2026,3,1);d.setDate(d.getDate()+g.day);return d}
function dateStr(){let d=dateObj();return `${d.getMonth()+1}月${d.getDate()}日（${dow[g.day%7]}）`}
function clamp(n,a=0,b=100){return Math.max(a,Math.min(b,n))}
function addLog(x,c=""){g.logs.unshift({t:dateStr(),x,c}); if(g.logs.length>80)g.logs.pop()}
function stat(label,val,desc){return `<div class="stat"><span>${label}</span><b>${Math.round(val)}</b><div class="bar"><div class="fill" style="width:${clamp(val)}%"></div></div><span>${desc}</span></div>`}

function render(){
$("date").textContent=dateStr();
let p=g.day<30?"基礎固め":g.day<120?"夏までの伸長期":g.day<210?"秋の実戦期":g.day<285?"冬の完成期":"入試本番";
$("phase").textContent=p;
$("days").textContent=`本番まで ${365-g.day} 日 / 勉強 ${Math.floor(g.totalStudy)} 時間`;
$("stats").innerHTML=
stat("英語",g.eng,"長文・文法・語彙")+stat("国語",g.jpn,"現代文・古文・漢文")+
stat("世界史",g.world,"通史・論述")+stat("記述力",g.writing,"答案作成")+
stat("体力",g.health,"生活習慣")+stat("メンタル",g.mental,"継続力")+
stat("集中力",g.energy,"今日の行動力")+stat("勉強習慣",clamp(g.streak*4),"継続日数");
$("money").textContent=`¥${g.money.toLocaleString()}`;
$("actions").innerHTML=`
<button class="action" onclick="study('eng')"><strong>📘 英語を勉強</strong><small>+英語 / 疲労</small></button>
<button class="action" onclick="study('jpn')"><strong>📕 国語を勉強</strong><small>+国語 / 疲労</small></button>
<button class="action" onclick="study('world')"><strong>📗 世界史を勉強</strong><small>+世界史 / 疲労</small></button>
<button class="action" onclick="study('all')"><strong>📚 3科目演習</strong><small>総合力 / 大疲労</small></button>
<button class="action" onclick="social()"><strong>💬 人と会う</strong><small>好感度 / メンタル</small></button>
<button class="action" onclick="rest()"><strong>🛌 休む</strong><small>体力 / メンタル</small></button>
<button class="action" onclick="partTime()"><strong>💴 バイト</strong><small>お金 / 時間</small></button>
<button class="action" onclick="simulateDay()"><strong>⏩ 1日進める</strong><small>何もしない</small></button>`;
$("exam").innerHTML=examText();
$("goal").innerHTML=goalText();
$("peopleList").innerHTML=Object.entries(g.people).map(([k,p])=>{
 let cooldown=Math.max(0,3-(g.day-p.last));
 return `<div class="person"><div class="name">${p.name} <span class="heart">♥</span> ${p.aff}</div><div class="relation">${relationLabel(p)}</div>
 <div class="meter"><span>好感</span><div class="bar"><div class="fill" style="width:${p.aff}%"></div></div><b>${p.aff}</b></div>
 <div class="meter"><span>信頼</span><div class="bar"><div class="fill" style="width:${p.trust}%"></div></div><b>${p.trust}</b></div>
 <div class="meter"><span>親密</span><div class="bar"><div class="fill" style="width:${p.close}%"></div></div><b>${p.close}</b></div>
 <div class="muted">機嫌 ${p.mood} / ${p.type} ${p.handhold?'<span class="pill pink">手をつないだ</span>':''} ${p.hug?'<span class="pill pink">ハグ済み</span>':''}</div>
 <div class="relrow"><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','line')">💬 LINE</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','study')">📚 勉強</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','lunch')">🍱 昼飯</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','return')">🚶 帰り道</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','date')">🎡 遊ぶ</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','talk')">🗣 相談</button><button class="relbtn" ${cooldown?'disabled':''} onclick="relAction('${k}','gift')">🎁 プレゼント</button><button class="relbtn" onclick="apologize('${k}')">🙏 謝る</button><button class="relbtn" onclick="distance('${k}')">↔ 距離を置く</button></div>
 </div>`
}).join("");
$("calendarGrid").innerHTML=Array.from({length:365},(_,i)=>`<div class="day ${i===g.day?"today":""} ${[305,315,325,335].includes(i)?"exam":""}">${i+1}<br>${i===305?"共テ":i===335?"早稲田":" "}</div>`).join("");
$("log").innerHTML=g.logs.map(l=>`<div class="event ${l.c}"><span class="muted">${l.t}</span><br>${l.x}</div>`).join("");
}
function examText(){
let avg=(g.eng+g.jpn+g.world+g.writing)/4;
let grade=avg>=78?"A":avg>=68?"B":avg>=58?"C":avg>=48?"D":"E";
return `<div style="font-size:42px;font-weight:800">${grade}判定</div><p>総合力 ${avg.toFixed(1)}</p>
<div class="muted">早稲田 商学部 / 文化構想</div><div class="progress">本番想定：${g.day<250?"まだ伸ばせる":"実戦力が重要な時期"}</div>`;
}
function goalText(){
let d=dateObj();let goals=g.day<90?["英単語を固める","世界史通史を一周","古文単語を継続"]:g.day<210?["早稲田レベル演習","過去問研究","弱点補強"]:["過去問演習","答案の精度","睡眠と体調管理"];
return `<b>${goals[g.day%goals.length]}</b><p class="muted">行動によってステータスと人間関係が変化します。</p>`;
}
function showTab(id,b){["status","people","calendar","world","history"].forEach(x=>$(x).style.display=x===id?"block":"none");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on")}

function study(type){
if(g.energy<18){addLog("今日はもう集中力が残っていない。休むべきだ。","bad");render();return}
let gain= type==="all"?2.2:4.2;
let cost=type==="all"?28:17;
if(type==="all"){g.eng+=gain;g.jpn+=gain;g.world+=gain;g.writing+=1.2}
else g[type]+=gain;
g[type==="all"?"eng":type]=type==="all"?g.eng:clamp(g[type]);
g.energy-=cost;g.health-=type==="all"?4:2;g.totalStudy+=type==="all"?5:2.5;g.streak++;
addLog(type==="all"?"3科目の実戦演習をやり切った。":`${{eng:"英語",jpn:"国語",world:"世界史"}[type]}を集中して勉強した。`,"good");
randomEvent();advance();
}
function rest(){g.energy=95;g.health=clamp(g.health+9);g.mental=clamp(g.mental+8);g.streak=0;addLog("今日は休養日。明日に備えて回復した。");advance()}
function social(){
 let keys=Object.keys(g.people);let k=keys[Math.floor(Math.random()*keys.length)];relAction(k,'meet',true)
}
function relationLabel(p){
 if(p.state==='恋人' && p.close>=80) return '💗 深い恋人関係';
 if(p.aff>=80 && p.trust>=70) return p.state==='恋人'?'💗 恋人':'✨ 特別な存在';
 if(p.aff>=65 && p.trust>=55) return '💛 親しい';
 if(p.aff>=50 && p.trust>=45) return '🙂 仲がいい';
 if(p.trust>=65) return '🤝 信頼できる友人';
 return p.state;
}
function relAction(k,action,fromSocial=false){
 let p=g.people[k];
 if(!fromSocial && g.day-p.last<3){addLog(`${p.name}とは少し間を空けた方がよさそうだ。`,'bad');render();return}
 if(g.energy<8){addLog('今日はもう人と関わる余力がない。','bad');render();return}
 let effects={line:[3,2,4,1],study:[4,5,6,0],meet:[7,4,10,5],talk:[4,9,7,2]}[action];
 let names={line:'LINE',study:'一緒に勉強',meet:'二人で会う',talk:'悩み相談'};
 let [a,t,c,m]=effects;
 if(k==='tetsu' && action==='study'){a=2;t=1;c=1;m=3}
 if(k==='keio' && action==='meet'){a+=2;c+=2}
 p.aff=clamp(p.aff+a);p.trust=clamp(p.trust+t);p.close=clamp(p.close+c);p.mood=clamp(p.mood+m);p.last=g.day;
 g.energy-=action==='meet'?20:action==='study'?14:10;g.mental=clamp(g.mental+(action==='talk'?7:action==='meet'?5:2));
 updateRelationship(k);
 let text=relationshipText(k,action);
 addLog(text, action==='talk'||p.state==='恋人'?'special':'good');
 if(relationshipUnlock(k)) return;
 advance();
}
function updateRelationship(k){
 let p=g.people[k];
 if(k==='rinka' && p.aff>=70 && p.trust>=65){p.state='恋人';p.type='恋人'}
 else if(k==='keio' && p.aff>=70 && p.trust>=60){p.state='好意'}
 else if(p.aff>=75 && p.trust>=65)p.state='親友';
 else if(p.aff>=60 && p.trust>=50)p.state='親しい';
 else if(p.aff>=50 || p.trust>=50)p.state='仲がいい';
}
function relationshipUnlock(k){
 let p=g.people[k];
 if(k==='rinka' && p.aff>=82 && p.trust>=75 && p.close>=80 && p.state==='恋人' && !p.deep){
  p.deep=true;
  openModal('りんかとの特別イベント',`${p.name}「受験も大事だけど、無理しすぎないでね。今日は少しだけ一緒にいたい」`,[
   {t:'一緒にゆっくり過ごす',f:()=>{p.close=clamp(p.close+6);p.trust=clamp(p.trust+4);addLog('りんかとの距離が一段と近づいた。','special');advance()}},
   {t:'勉強を優先する',f:()=>{p.trust=clamp(p.trust+3);g.mental=clamp(g.mental+2);addLog('りんかは少し寂しそうだったが、応援してくれた。','special');advance()}}
  ]);return true;
 }
 if(k==='keio' && p.aff>=78 && p.trust>=65 && p.close>=65 && !p.special){
  p.special=true;openModal('クラスメイトとの分岐',`${p.name}「最近、話してるとなんか落ち着くんだよね」`,[
   {t:'素直に嬉しいと伝える',f:()=>{p.aff=clamp(p.aff+5);p.close=clamp(p.close+5);addLog('クラスメイトとの関係が特別な段階に進んだ。','special');advance()}},
   {t:'受験を優先すると伝える',f:()=>{p.trust=clamp(p.trust+5);addLog('距離感を保ちながら、お互い受験を頑張ることにした。','good');advance()}}
  ]);return true;
 }
 return false;
}
function relationshipText(k,a){
 let p=g.people[k];
 let base={line:'連絡を取った。',study:'一緒に勉強した。',meet:'二人で会った。',talk:'悩みを聞いた。'}[a];
 if(k==='tetsu') base=a==='study'?'てつと模試や勉強量について話した。':'てつと話した。良い刺激になった。';
 if(k==='rinka' && a==='line') base='りんかとLINEした。受験のことや日常の話で少し距離が縮まった。';
 if(k==='mokujyo' && a==='talk') base='もくじょに弱音を話した。気持ちが少し軽くなった。';
 return `${p.name}と${base}`;
}
function partTime(){g.money+=6500;g.energy-=35;g.mental=clamp(g.mental-2);g.totalStudy+=0;addLog("バイトで¥6,500稼いだ。勉強時間は削られた。");advance()}
function simulateDay(){g.energy=clamp(g.energy+15);g.health=clamp(g.health-1);g.mental=clamp(g.mental-1);addLog("特別な行動をせず1日を終えた。");randomEvent();advance()}
function advance(){
Object.values(g.people).forEach(p=>{p.mood=clamp(p.mood+(Math.random()<.5?-2:2));});
g.day++;
if(g.day>=365){finish();return}
if(g.day%7===0){g.money-=3500;addLog("週の生活費として¥3,500使った。");}
if(g.day%30===0){g.eng+=1;g.jpn+=1;g.world+=1;addLog("1か月の継続効果で基礎力が少し伸びた。","good")}
render()
}
function randomEvent(){
let r=Math.random();
if(r<.10){g.people.tetsu.aff=clamp(g.people.tetsu.aff+3);addLog("てつが模試の結果を見せてきた。負けたくない。","special")}
else if(r<.18){g.mental=clamp(g.mental-7);addLog("SNSを見すぎて時間を失った。メンタルも少し下がった。","bad")}
else if(r<.24){g.eng+=2;addLog("予備校の先生から英語の勉強法を教わった。","good")}
else if(r<.29){g.money-=2500;addLog("参考書を購入した。¥2,500。")}
else if(r<.33){g.people.rinka.aff=clamp(g.people.rinka.aff+8);addLog("りんかから嬉しい連絡が来た。","special")}
}
function finish(){
let avg=(g.eng+g.jpn+g.world+g.writing)/4;
let pass=avg>=73 && g.mental>=35;
openModal("1年間の浪人生活、終了",pass?`早稲田に合格した。総合力 ${avg.toFixed(1)}。この1年の積み重ねが結果になった。`:`早稲田は不合格だった。総合力 ${avg.toFixed(1)}。ただし、この1年で積み上げたものは残っている。`,[{t:"もう一度プレイ",f:()=>resetGame()}])
}
function openModal(title,text,opts){$("modalTitle").textContent=title;$("modalText").textContent=text;$("choices").innerHTML=opts.map((o,i)=>`<button class="choice" id="c${i}">${o.t}</button>`).join("");opts.forEach((o,i)=>$("c"+i).onclick=()=>{closeModal();o.f()});$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}
function saveGame(){localStorage.setItem("wasedaRun",JSON.stringify(g));addLog("ゲームを保存した。","good");render()}
function loadGame(){let x=localStorage.getItem("wasedaRun");if(x){g=JSON.parse(x);addLog("保存データを読み込んだ。","good");render()}else{addLog("保存データがありません。","bad");render()}}
function resetGame(){if(confirm("最初からやり直しますか？")){g=JSON.parse(JSON.stringify(initial));render()}}

/* ===== V3 systems ===== */
const places={school:['予備校','自習室と教室'],cafe:['カフェ','勉強・雑談'],park:['公園','帰り道・休憩'],station:['駅','偶然の遭遇'],shop:['本屋','参考書・プレゼント'],home:['自宅','回復・整理']};
const monthNames=['4月','5月','6月','7月','8月','9月','10月','11月','12月','1月','2月','3月'];
const monthly=['新年度・新しいクラス','中間模試・友達の輪','梅雨・疲労管理','夏祭り・夏期講習','夏休み・長時間勉強','秋模試・進路の話','文化祭・関係の分岐','早慶模試・焦り','冬期講習・クリスマス','共通テスト直前','共通テスト・出願','早稲田入試・卒業'];
const personalities={rinka:'距離が近くなるほど寂しさも出る。約束を重視。',mokujyo:'聞き上手。相談されると信頼が上がりやすい。',tetsu:'競争心が強い。勉強で関係が動く。',keio:'慎重。急に距離を詰めるより会話の積み重ねが有効。'};
function ensureV3(){
 g.rumors=g.rumors||[]; g.promises=g.promises||[]; g.history=g.history||{handholds:0,hugs:0,dates:0,lines:0,meetings:0,arguments:0,promisesKept:0,promisesBroken:0,rumors:0}; g.flags=g.flags||{}; g.location=g.location||'school';
 Object.entries(g.people).forEach(([k,p])=>{p.personality=personalities[k]||'';p.history=p.history||[];p.handhold=!!p.handhold;p.hug=!!p.hug;p.cooldownUntil=p.cooldownUntil||-1});
}
ensureV3();
function pushHistory(k,action,result){g.people[k].history.push({day:g.day,action,result});if(g.people[k].history.length>30)g.people[k].history.shift()}
function addRumor(text,source){g.rumors.unshift({day:g.day,text,source});if(g.rumors.length>12)g.rumors.pop();g.history.rumors++}
function addPromise(k,day,type){g.promises.push({k,day,type,done:false});addLog(`${g.people[k].name}と「${type}」の約束をした。`,'special')}
function checkPromises(){
 g.promises.forEach(pr=>{if(!pr.done&&pr.day===g.day){pr.due=true;openPromise(pr)}})
 const overdue=g.promises.filter(pr=>!pr.done&&!pr.due&&pr.day<g.day); overdue.forEach(pr=>{pr.done=true;g.people[pr.k].trust=clamp(g.people[pr.k].trust-7);g.history.promisesBroken++;addLog(`${g.people[pr.k].name}との約束を守れなかった。信頼が下がった。`,'bad')});
}
function openPromise(pr){const p=g.people[pr.k];openModal('約束の日',`${p.name}「今日、約束してたよね。どうする？」`,[{t:'約束を守る',f:()=>{pr.done=true;g.history.promisesKept++;p.trust=clamp(p.trust+7);p.close=clamp(p.close+4);addLog(`${p.name}との約束を守った。`,'good');advance()}},{t:'受験を優先して断る',f:()=>{pr.done=true;g.history.promisesBroken++;p.trust=clamp(p.trust-4);g.mental=clamp(g.mental+2);addLog(`${p.name}との約束を断った。受験を優先した。`,'bad');advance()}}])}
function lineChat(k){
 const p=g.people[k];g.history.lines++;p.last=g.day;p.mood=clamp(p.mood+2);g.energy-=8;
 const qs={rinka:[['今日どうだった？','普通だったよ。でもちょっと疲れたかも。'],['無理すんなよ','ありがとう。そう言ってくれると安心する。'],['今度一緒に勉強しよ','うん、約束。']],mokujyo:[['最近どう？','まあまあ。そっちは？'],['ちょっと相談がある','もちろん。聞くよ。'],['今度飯いこ','いいね、行こう。']],tetsu:[['最近勉強してる？','当然。お前には負けない。'],['模試どうだった？','次はもっと上げる。'],['一緒に演習する？','それなら勝負な。']],keio:[['今日疲れた？','ちょっとね。でも話すと楽。'],['また話そ','うん。私もそう思ってた。'],['今度カフェ行く？','予定が合えば行きたい。']]}[k]||[];
 let html=`<div class="chat"><div class="bubble npc">${p.name}とのLINE</div></div>`;openModal('LINE',html,qs.map((q,i)=>({t:q[0],f:()=>{p.aff=clamp(p.aff+[3,4,5][i]);p.trust=clamp(p.trust+[1,2,3][i]);p.close=clamp(p.close+[1,3,4][i]);pushHistory(k,'LINE',q[0]);addLog(`${p.name}とLINEした。「${q[0]}」`,'good');if(i===2&&g.day+7<365)addPromise(k,g.day+7,'一緒に会う');updateRelationship(k);advance()}})));}
function physicalEvent(k){
 const p=g.people[k];
 if(k!=='rinka' && p.state!=='恋人') return false;
 if(p.close>=68&&!p.handhold){p.handhold=true;g.history.handholds++;p.close=clamp(p.close+6);p.trust=clamp(p.trust+4);addLog(`${p.name}と帰り道、自然に手をつないだ。`,'special');return true}
 if(p.close>=82&&p.handhold&&!p.hug){p.hug=true;g.history.hugs++;p.close=clamp(p.close+7);p.trust=clamp(p.trust+5);addLog(`${p.name}と別れ際、短くハグをした。距離がまた一段近づいた。`,'special');return true}
 return false;
}
function relationStage(p){if(p.state==='恋人'&&p.close>=82)return '深い恋人関係';if(p.state==='恋人')return '恋人';if(p.aff>=80&&p.trust>=70)return '親友';if(p.aff>=70&&p.trust>=60)return '親しい';if(p.aff>=55)return '仲がいい';return p.state}
function relActionV3(k,action){ if(action==='meet') action='date';
 const p=g.people[k];if(g.day-p.last<2){addLog(`${p.name}とは少し間を空ける方がよさそう。`,'bad');render();return}
 const effects={line:[3,2,3,1,8],study:[4,5,5,0,14],lunch:[6,3,7,3,15],return:[5,4,8,4,13],date:[9,5,12,6,25],talk:[4,9,7,3,10],gift:[7,6,6,4,18]}[action]||[0,0,0,0,0];
 let [a,t,c,m,cost]=effects;if(action==='gift'&&g.money<3000){addLog('プレゼントを買うお金が足りない。','bad');render();return}
 if(action==='gift')g.money-=3000;
 p.aff=clamp(p.aff+a);p.trust=clamp(p.trust+t);p.close=clamp(p.close+c);p.mood=clamp(p.mood+m);p.last=g.day;g.energy-=cost;g.mental=clamp(g.mental+(action==='talk'?5:action==='date'?3:1));
 if(action==='line'){lineChat(k);return}
 if(action==='date'){g.history.dates++;if(g.day+7<365)addPromise(k,g.day+7,'次の遊び');}
 if(action==='return')physicalEvent(k);
 updateRelationship(k);pushHistory(k,action,'交流');
 if(Math.random()<.18&&action!=='talk'){addRumor(`${p.name}と最近よく一緒にいるらしい。`,'予備校');addLog(`噂が広がった。「${p.name}と最近よく一緒にいるらしい」`,'special')}
 if(k==='rinka'&&p.state==='恋人'&&p.close>=68)physicalEvent(k);
 if(k==='keio'&&p.aff>=75&&p.trust>=65&&!g.flags.keioConfession){g.flags.keioConfession=true;openModal('クラスメイトとの分岐',`${p.name}「最近、あなたと話す時間、けっこう好きかも」`,[{t:'素直に嬉しい',f:()=>{p.aff=clamp(p.aff+6);p.close=clamp(p.close+5);addLog('クラスメイトとの距離が特別な段階へ。','special');advance()}},{t:'今は受験に集中する',f:()=>{p.trust=clamp(p.trust+6);addLog('お互い受験を優先することにした。','good');advance()}}]);return}
 advance();
}
function apologize(k){const p=g.people[k];p.trust=clamp(p.trust+6);p.mood=clamp(p.mood+8);p.last=g.day;g.history.arguments=Math.max(0,g.history.arguments-1);addLog(`${p.name}にちゃんと謝った。少し空気が戻った。`,'good');g.energy-=5;advance()}
function distance(k){const p=g.people[k];p.close=clamp(p.close-8);p.aff=clamp(p.aff-3);p.mood=clamp(p.mood-3);addLog(`${p.name}とは少し距離を置くことにした。`);advance()}
function renderWorld(){
 ensureV3();$('map').innerHTML=Object.entries(places).map(([k,v])=>`<button class="loc" onclick="travel('${k}')">📍 ${v[0]}<small>${v[1]}</small></button>`).join('');
 $('rumors').innerHTML=g.rumors.length?g.rumors.slice(0,5).map(r=>`<div>・${r.text} <span class="muted">(${r.day+1}日目)</span></div>`).join(''):'<span class="muted">まだ噂はない。</span>';
 $('promises').innerHTML=g.promises.filter(p=>!p.done).slice(0,5).map(p=>`<div>・${g.people[p.k].name}：${p.type} / ${p.day+1}日目</div>`).join('')||'<span class="muted">予定なし。</span>';
}
function travel(k){g.location=k;g.energy-=3;addLog(`${places[k][0]}へ移動した。`);if(Math.random()<.28){const keys=Object.keys(g.people).filter(x=>x!== 'tetsu');const who=keys[Math.floor(Math.random()*keys.length)];g.people[who].mood=clamp(g.people[who].mood+3);addLog(`${places[k][0]}で${g.people[who].name}と偶然会った。`,'special')}renderWorld();render()}
function autonomousWorld(){
 const ps=Object.entries(g.people);ps.forEach(([k,p])=>{if(Math.random()<.35){p.mood=clamp(p.mood+(Math.random()<.5?-3:3));p.last=Math.max(p.last,g.day-10)}});
 if(Math.random()<.10){const keys=Object.keys(g.people);const a=keys[Math.floor(Math.random()*keys.length)],b=keys[Math.floor(Math.random()*keys.length)];if(a!==b){g.people[a].mood=clamp(g.people[a].mood-3);addRumor(`${g.people[a].name}と${g.people[b].name}が何か話していた。`,'人間関係');}}
 if(Math.random()<.08&&g.day>20){g.people.tetsu.world=undefined;g.people.tetsu.aff=clamp(g.people.tetsu.aff+2);addLog('てつが勝手に勉強量を伸ばしている。ライバルとの差が動いた。','special')}
}
function monthlyEvent(){if(g.day%30!==0)return;const mi=Math.floor(g.day/30);if(mi<monthly.length){addLog(`月間イベント：${monthly[mi]}`,'special');if(mi===3){g.mental=clamp(g.mental+5);addLog('夏祭りの誘いが増えた。','special')}if(mi===6){g.people.rinka.mood=clamp(g.people.rinka.mood+8);g.people.mokujyo.aff=clamp(g.people.mokujyo.aff+4)}}}
function renderMonthEvents(){$('monthEvents').innerHTML=monthly.map((x,i)=>`<div class="month"><b>${monthNames[i]}</b><br>${x}</div>`).join('')}
function renderHistory(){let avg=(g.eng+g.jpn+g.world+g.writing)/4;$('summary').innerHTML=`<div>総勉強時間<br><b>${Math.floor(g.totalStudy)}h</b></div><div>最高判定<br><b>${avg>=78?'A':avg>=68?'B':avg>=58?'C':avg>=48?'D':'E'}</b></div><div>手をつないだ回数<br><b>${g.history.handholds}</b></div><div>ハグ<br><b>${g.history.hugs}</b></div><div>デート・遊び<br><b>${g.history.dates}</b></div><div>約束を守った<br><b>${g.history.promisesKept}</b></div><div>約束を破った<br><b>${g.history.promisesBroken}</b></div><div>噂が生まれた<br><b>${g.history.rumors}</b></div>`;$('milestones').innerHTML=g.logs.filter(x=>x.c==='special').slice(0,14).map(x=>`<div>・<span class="muted">${x.t}</span> ${x.x}</div>`).join('')}
// Override render to include V3 panels while retaining the original UI.
const oldRender=render;
render=function(){oldRender();ensureV3();renderWorld();renderMonthEvents();renderHistory();Object.entries(g.people).forEach(([k,p])=>{p.state=relationStage(p)});};
const oldRelAction=relAction;relAction=function(k,a,fromSocial=false){if(fromSocial){return relActionV3(k,'meet')}return relActionV3(k,a)};
const oldAdvance=advance;
advance=function(){autonomousWorld();monthlyEvent();oldAdvance();checkPromises();};

render();
</script>
